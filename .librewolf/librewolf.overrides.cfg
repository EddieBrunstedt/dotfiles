pref("media.peerconnection.ice.no_host", false);
pref("browser.sessionstore.resume_from_crash", false);
pref("middlemouse.paste", false);
pref("general.autoScroll", true);
pref("webgl.disabled", false);
pref("dom.webgpu.enabled", true);
pref("identity.fxaccounts.enabled", true);
pref("privacy.resistFingerprinting", false);

// ── NVIDIA/Wayland flicker workaround ──
// WebRender "partial present" redraws only damaged rects; on NVIDIA+Wayland the
// buffer-age tracking misfires and stale rects flash during scroll/hover.
// 0 = always redraw the full frame (negligible cost on a 1080p desktop GPU).
pref("gfx.webrender.max-partial-present-rects", 0);

// ── Disable UI animations ──
// The ~1s toolbar (address bar/tabs) slide-up when entering fullscreen is a
// "cosmetic" chrome animation (modern replacement for the old ui.prefersReducedMotion
// trick). This disables that slide plus other UI slide animations.
# pref("toolkit.cosmeticAnimations.enabled", false);
// Legacy pref for the fullscreen toolbar animation (no-op on current versions; harmless).
# pref("browser.fullscreen.animateUp", 0);
// Video/DOM fullscreen black fade.
# pref("full-screen-api.transition-duration.enter", "0 0");
# pref("full-screen-api.transition-duration.leave", "0 0");
# pref("full-screen-api.transition.timeout", 0);
# pref("full-screen-api.warning.timeout", 0);
