# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Options
set -g prefix C-a		# Use Ctrl + A as prefix keybind
set -g base-index 1             # Start indexing windows at 1 instead of 0
set -g detach-on-destroy off    # Don't exit from tmux when closing a session
set -g escape-time 0            # Zero-out escape time delay
set -g history-limit 1000000    # Increase history size (from 2,000)
set -g renumber-windows on      # Renumber all windows when any window is closed
set -g set-clipboard on         # Use system clipboard
set -g status-position "top"	# Display statusbar on top

# Keybinds
bind-key C-a last-window

# Make tmux-thumbs copy to clipboard
set -g @thumbs-command 'echo -n {} | xclip -selection clipboard'

# Rose Pine theme settings
set -g @rose_pine_variant 'main' # Other options are 'main', 'moon' or 'dawn'
set -g @rose_pine_directory 'on' # Show current working folder
set -g @rose_pine_disable_active_window_menu 'on' # Disables showing active window on the left

run '/usr/share/tmux-plugin-manager/tpm'
