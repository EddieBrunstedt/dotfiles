# === Plugin Setup ===
set -g @plugin 'rose-pine/tmux'                        # Rose Pine theme
set -g @plugin 'sainnhe/tmux-fzf'                      # Fuzzy finder
set -g @plugin 'tmux-plugins/tmux-sensible'            # Sensible defaults
set -g @plugin 'tmux-plugins/tmux-yank'                # Copy to system clipboard
set -g @plugin 'tmux-plugins/tpm'                      # Plugin manager

# === Core Settings ===
set -g prefix C-a

set -g extended-keys on
set -g extended-keys-format csi-u
set -g escape-time 0
set -g history-limit 1000000
set -g mouse on
set -g set-clipboard on
set -g status-position top
set -g allow-passthrough on

# Window behavior
set -g base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

# === Plugin Configuration ===

# Rose Pine theme options
set -g @rose_pine_variant "main"
set -g @rose_pine_directory "on"
set -g @rose_pine_disable_active_window_menu "on"

# Tmux Thumbs
set -g @thumbs-key f
set -g @thumbs-command "echo -n {} | wl-copy"

# tmux-yank: don't bind mouse drag end; local bindings below keep copy-mode open
# and avoid launching an external clipboard command on every mouse selection.
set -g @yank_with_mouse off

# === Key Bindings ===

## Session management with sesh
# -H/--hide-attached hides the current tmux session from the picker.
# Optional: add -d/--hide-duplicates to these `sesh list` commands if zoxide/config
# entries duplicate tmux sessions and make the list noisy.
bind "Tab" run-shell "sesh connect \"$(
  sesh list -H --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list -H --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t -H --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list -H --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

bind "t" choose-tree -Zs                                  # Session tree (x to kill)


## Window navigation
bind "C-a" last-window
bind -r "<" "swap-window -d -t -1"
bind -r ">" "swap-window -d -t +1"

## Window and pane creation
bind "c" "new-window -c '#{pane_current_path}'"
bind "v" "split-window -h -c '#{pane_current_path}'"
bind "s" "split-window -v -c '#{pane_current_path}'"
bind "V" "split-window -fh -c '#{pane_current_path}'"     # Full-width horizontal
bind "S" "split-window -fv -c '#{pane_current_path}'"     # Full-height vertical

## Pane navigation with prefix
bind "h" select-pane -L
bind "j" select-pane -D
bind "k" select-pane -U
bind "l" select-pane -R
bind "C-h" select-pane -L
bind "C-j" select-pane -D
bind "C-k" select-pane -U
bind "C-l" select-pane -R

## Pane navigation without prefix (Alt)
bind -n "M-h" select-pane -L
bind -n "M-j" select-pane -D
bind -n "M-k" select-pane -U
bind -n "M-l" select-pane -R

## Pane resizing
bind -r "H" resize-pane -L 5
bind -r "J" resize-pane -D 5
bind -r "K" resize-pane -U 5
bind -r "L" resize-pane -R 5

## Pane management
bind "x" kill-pane
bind -n "M-x" kill-pane                                # Alt+x without prefix

# Don't auto-exit copy-mode when the wheel scrolls past the bottom (only q exits)
bind -T root WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode }

# Stay in copy mode on double/triple click
bind -T copy-mode    DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-selection
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-selection
bind -T copy-mode    TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-selection
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-selection

# === Initialize TPM ===
# Set explicitly so tpm's helper scripts can find the plugin dir when invoked
# outside tmux (e.g. topgrade); `run -b` sets it too late for that path.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
run -b "/usr/share/tmux-plugin-manager/tpm"

# Override tmux-yank's drag-end binding to skip the external clipboard binary
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection
