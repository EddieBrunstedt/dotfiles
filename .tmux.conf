################## Plugins ##################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
################## Options ##################

# Tmux native options
set-option -a terminal-overrides ",alacritty:RGB" # For true color
set -g mouse on                 # Use mouse for scrolling, selecting panes, resizing panes, etc.
set -g prefix C-a               # Use Ctrl + A as prefix keybind
set -g base-index 1             # Start indexing windows at 1 instead of 0
set -g detach-on-destroy on     # Exit tmux when closing a session
set -g escape-time 0            # Zero-out escape time delay
set -g history-limit 1000000    # Increase history size (from 2,000)
set -g renumber-windows on      # Renumber all windows when any window is closed
set -g set-clipboard on         # Use system clipboard
set -g status-position "top"    # Display statusbar on top

# Make tmux-thumbs copy to clipboard
set -g @thumbs-command 'echo -n {} | xclip -selection clipboard'

# Rose Pine theme settings
set -g @rose_pine_directory 'on' # Show current working folder
set -g @rose_pine_disable_active_window_menu 'on' # Disables showing active window on the left
set -g @rose_pine_variant 'main' # Other options are 'main', 'moon' or 'dawn'

################## Keybinds ##################

# Window management
bind "c" new-window -c "#{pane_current_path}"
bind C-a last-window
bind -r "<" swap-window -d -t -1 # Move window left
bind -r ">" swap-window -d -t +1 # Move window right

# Split panes
bind "s" split-window -v -c "#{pane_current_path}"
bind "v" split-window -h -c "#{pane_current_path}"
# Split window (creates the new pane to the far side)
bind "V" split-window -fh -c "#{pane_current_path}"
bind "S" split-window -fv -c "#{pane_current_path}"

set -g @thumbs-key f

# Select panes
bind h   select-pane -L
bind C-h select-pane -L
bind j   select-pane -D
bind C-j select-pane -D
bind k   select-pane -U
bind C-k select-pane -U
bind l   select-pane -R
bind C-l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Initialize TMUX plugin manager
run '/usr/share/tmux-plugin-manager/tpm'
