# === Plugin Setup ===
set -g @plugin '27medkamal/tmux-session-wizard'        # Session management
set -g @plugin 'fcsonline/tmux-thumbs'                 # Quick text selection/copy
set -g @plugin 'rose-pine/tmux'                        # Rose Pine theme
set -g @plugin 'sainnhe/tmux-fzf'                      # Fuzzy finder
set -g @plugin 'tmux-plugins/tmux-sensible'            # Sensible defaults
set -g @plugin 'tmux-plugins/tmux-yank'                # Copy to system clipboard
set -g @plugin 'tmux-plugins/tpm'                      # Plugin manager

# === Core Settings ===
set -g prefix C-a

set -g extended-keys on
set -g extended-keys-format csi-u
set -g escape-time 0
set -g history-limit 1000000
set -g mouse on
set -g set-clipboard on
set -g status-position top

# Window behavior
set -g base-index 1
set -g renumber-windows on
set -g detach-on-destroy on

# === Plugin Configuration ===

# Rose Pine theme options
set -g @rose_pine_variant "main"
set -g @rose_pine_directory "on"
set -g @rose_pine_disable_active_window_menu "on"

# Tmux Thumbs
set -g @thumbs-key f
set -g @thumbs-command "echo -n {} | xclip -selection clipboard"

# Session Wizard
set -g @session-wizard "Tab"

# === Key Bindings ===

## Window navigation
bind "C-a" last-window
bind -r "<" "swap-window -d -t -1"
bind -r ">" "swap-window -d -t +1"

## Window and pane creation
bind "c" "new-window -c '#{pane_current_path}'"
bind "v" "split-window -h -c '#{pane_current_path}'"
bind "s" "split-window -v -c '#{pane_current_path}'"
bind "V" "split-window -fh -c '#{pane_current_path}'"     # Full-width horizontal
bind "S" "split-window -fv -c '#{pane_current_path}'"     # Full-height vertical

## Pane navigation with prefix
bind "h" select-pane -L
bind "j" select-pane -D
bind "k" select-pane -U
bind "l" select-pane -R
bind "C-h" select-pane -L
bind "C-j" select-pane -D
bind "C-k" select-pane -U
bind "C-l" select-pane -R

## Pane navigation without prefix (Alt)
bind -n "M-h" select-pane -L
bind -n "M-j" select-pane -D
bind -n "M-k" select-pane -U
bind -n "M-l" select-pane -R

## Pane resizing
bind -r "H" resize-pane -L 5
bind -r "J" resize-pane -D 5
bind -r "K" resize-pane -U 5
bind -r "L" resize-pane -R 5

## Pane management
bind "x" kill-pane
bind -n "M-x" kill-pane                                # Alt+x without prefix

# === Initialize TPM ===
run "/usr/share/tmux-plugin-manager/tpm"
