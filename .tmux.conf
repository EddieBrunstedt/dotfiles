# Prefix binding to C-w
unbind C-b
set -g prefix C-w
bind C-w send-prefix

# Clear history
bind -n C-h clear-history

set -g default-terminal "screen-256color"
set -g terminal-overrides ",st-256color:Tc"

# vi mode
set-window-option -g mode-keys vi

# Limit scrollback
set -g history-limit 30000

# Start a non-login shell
set -g default-command "${SHELL}"

# Adapt title bar  to SSH host
set -g set-titles on
set -g set-titles-string "#T"

#### KEY BINDINGS ####

## Sessions ##
bind -n M-w choose-session      # Select session            :: Alt + w
bind -n M-n new-session         # New session               :: Alt + n
bind -n M-b switch-client -l    # Go to last session        :: Alt + b
                                # Rename session            :: Alt + r
bind -n M-r command-prompt -I "#W" "rename-session '%%'"
                                # Jump to session           :: Alt + J
bind -n M-C-j new-window -n "session-switcher" "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

## Windows ##
bind -n M-c new-window -c "#{pane_current_path}"    # New Window  :: Alt + c
bind -r "<" swap-window -d -t -1            # Move window left    :: leader, <
bind -r ">" swap-window -d -t +1            # Move window right   :: leader, >
# Split window vertically                                         :: Alt + v
bind -n M-v split-window -h -c "#{pane_current_path}"
# Split full window vertically                                    :: Alt + V
bind -n M-C-v split-window -fh -c "#{pane_current_path}"
# Split window horizontally                                       :: Alt + s
bind -n M-s split-window -v -c "#{pane_current_path}"
# Split full window horizontally                                  :: Alt + S
bind -n M-C-s split-window -fv -c "#{pane_current_path}"

## Panes ##
bind d kill-pane                # Kill pane                 :: Alt + c
bind -r H resize-pane -L 5      # Pane Resize Left          :: leader, h
bind -r L resize-pane -R 5      # Pane Resize Right         :: leader, l
bind -r K resize-pane -U 5      # Pane Resize Up            :: leader, k
bind -r J resize-pane -D 5      # Pane Resize Down          :: leader, j
bind h  select-pane -L      # Pane Select Left          :: leader, h
bind l  select-pane -R      # Pane Select Right         :: leader, l
bind k  select-pane -U      # Pane Select Up            :: leader, k
bind j  select-pane -D      # Pane Select Down          :: leader, j

## Copy mode ##
bind -T copy-mode-vi 'v' send -X begin-selection    # Begin selection  :: v
bind -T copy-mode-vi 'V' send -X select-line        # Select line      :: V

#### PLUGINS (used by tpm) ####
set -g @plugin 'tmux-plugins/tpm'               # Plugin manager
set -g @plugin 'tmux-plugins/tmux-sensible'     # Opinionated config ()
set -g @plugin 'tmux-plugins/tmux-yank'         # Copy to the system clipboard
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin "arcticicestudio/nord-tmux"

# Initialize tpm (should be in bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
