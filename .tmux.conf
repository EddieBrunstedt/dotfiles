# Prefix binding to C-w
unbind C-b
set -g prefix C-w
bind C-w send-prefix

# Theme
source-file ~/.tmux/themes/tomorrow-night.tmux

# Clear history
bind -n C-h clear-history

set -g default-terminal "screen-256color"
set -g terminal-overrides ",st-256color:Tc"

# vi mode
set-window-option -g mode-keys vi

# Limit scrollback
set -g history-limit 30000

# Start a non-login shell
set -g default-command "${SHELL}"

# Title bar adapt to SSH host
set -g set-titles on
set -g set-titles-string "#T"

# Windows
bind-key "c" new-window -c "#{pane_current_path}"   # Create Window
bind-key -r "<" swap-window -d -t -1                # Move window left
bind-key -r ">" swap-window -d -t +1                # Move window right

# Bindings for switching panes
bind-key h   select-pane -L
bind-key j   select-pane -D
bind-key k   select-pane -U
bind-key l   select-pane -R

# Window splitting
bind-key "v" split-window -h -c "#{pane_current_path}"  # Split window vertically
bind-key "V" split-window -fh -c "#{pane_current_path}" # Split full window vertically
bind-key "s" split-window -v -c "#{pane_current_path}"  # Split window horizontally
bind-key "S" split-window -fv -c "#{pane_current_path}" # Split full window horizontally

# Resize Pane Bindings
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5


# Close window without confirmation
bind-key d kill-pane

# Session handling
bind-key x detach
bind-key "\\" choose-session
bind-key r command-prompt -I "#W" "rename-session '%%'"

# Plugins
set -g @plugin 'tmux-plugins/tpm'                   # Plugin manager
set -g @plugin 'tmux-plugins/tmux-sensible'         # A set of tmux options that should be acceptable to everyone.
set -g @plugin 'tmux-plugins/tmux-yank'             # Copy to the system clipboard
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
