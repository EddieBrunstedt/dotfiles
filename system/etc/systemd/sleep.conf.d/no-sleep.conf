# This machine keeps working unattended (Jellyfin, long jobs), so it never
# suspends or hibernates, whoever asks: systemctl, a Sleep key, an app. The
# nearest thing to sleep is the panel off, via "Lock and blank screen" in
# power-menu (SUPER+q). Installed by `just install-session`.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
