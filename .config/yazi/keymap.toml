[mgr]
prepend_keymap = [
  { on = ["<C-n>"], run = "plugin dragon", desc = "Drag selected files out" },

  # Disable keybinds
  { on = ["q"], run = "noop" },
  { on = ["g", "c"], run = "noop" },
  { on = ["g", "d"], run = "noop" },
  { on = ["g", "h"], run = "noop" },

  # Static bookmarks
  { on = [";", "C"], run = "cd ~/.config", desc = "Config" },
  { on = [";", "C"], run = "cd ~/.config", desc = "Config" },
  { on = [";", "D"], run = "cd ~/desktop", desc = "Dotfiles" },
  { on = [";", "c"], run = "cd ~/code", desc = "Code" },
  { on = [";", "d"], run = "cd ~/desktop", desc = "Desktop" },
  { on = [";", "h"], run = "cd ~", desc = "Home" },
  { on = [";", "p"], run = "cd ~/projects", desc = "Projects" },
  { on = [";", "s"], run = "cd ~/shared", desc = "Shared" },
  { on = [";", "v"], run = "cd ~/shared/video", desc = "Video" },
]
