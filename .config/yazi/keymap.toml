[manager]
prepend_keymap = [
    { on = [ "<PageUp>" ],   run = "seek -5", desc = "Seek up 5 units in the preview" },
    { on = [ "<PageDown>" ], run = "seek 5",  desc = "Seek down 5 units in the preview" },
    { on = [ "<C-n>" ], run = '''
        shell 'dragon-drop -a -x "$@"' --confirm
    '''}
]
