<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>sans</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>

  <!-- Fira Sans as the proportional default.
       This needs a strong binding rather than an <alias><prefer>: prefer
       compiles to a weak family edit, and /etc/fonts/conf.d ships sans-serif
       rules both before (45-latin, 46-noto-sans) and after (60-latin,
       66-noto-sans) the position 50 where 50-user.conf pulls this file in.
       A weak edit loses to those; a strong one wins regardless of order.
       Noto Sans stays above as the fallback for scripts Fira Sans lacks. -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Fira Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Fira Sans</string></edit>
  </match>

  <!-- Literata as the serif default. Same strong-binding reasoning as above:
       /etc/fonts/conf.d ships serif rules on both sides of position 50
       (45-latin, 65-noto-serif), so a weak <prefer> edit gets overridden.
       Literata carries only ~1800 glyphs, so the Noto Serif entry in the
       alias above does real work here as the fallback for anything it
       lacks — more than a wider-coverage serif would need. -->
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Literata</string></edit>
  </match>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Maple Mono NF</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
</fontconfig>
