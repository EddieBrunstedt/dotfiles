<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- CJK coverage for the proportional generics. Han unification puts several
       regional forms of the same codepoint in one encoding, so the order below
       decides which one untagged text gets: TC leads because the Han here shows
       up as traditional-Chinese glosses in otherwise-English prose. SC/JP/KR
       follow for the characters each has and TC lacks — they are not redundant.
       Lang-tagged text (a browser's lang=ja, say) still overrides all of this
       via fontconfig's own matching; the order is only the untagged default. -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK TC</family>
      <family>Noto Serif CJK SC</family>
      <family>Noto Serif CJK JP</family>
      <family>Noto Serif CJK KR</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>sans</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>

  <!-- Fira Sans as the proportional default.
       This needs a strong binding rather than an <alias><prefer>: prefer
       compiles to a weak family edit, and /etc/fonts/conf.d ships sans-serif
       rules both before (45-latin, 46-noto-sans) and after (60-latin,
       66-noto-sans) the position 50 where 50-user.conf pulls this file in.
       A weak edit loses to those; a strong one wins regardless of order.
       Noto Sans stays above as the fallback for scripts Fira Sans lacks. -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Fira Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Fira Sans</string></edit>
  </match>

  <!-- Literata as the serif default. Same strong-binding reasoning as above:
       /etc/fonts/conf.d ships serif rules on both sides of position 50
       (45-latin, 65-noto-serif), so a weak <prefer> edit gets overridden.
       Literata carries only ~1800 glyphs, so the Noto Serif entry in the
       alias above does real work here as the fallback for anything it
       lacks — more than a wider-coverage serif would need. -->
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Literata</string></edit>
  </match>
  <!-- Maple Mono NF CN is the same typeface with Han coverage added, so it
       fills CJK gaps at the correct cell width instead of leaving tofu or
       landing on a proportional fallback that breaks column alignment.
       It sits below plain NF deliberately: the Latin designs are identical,
       and keeping NF primary means the font-feature set tuned against it
       (ss05/ss06, the cv rules) applies to everything it can already draw.
       Without this entry CJK still resolves, but only via coverage sorting
       at rank 8 of 188 — an accident of what else is installed, not a rule. -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Maple Mono NF</family>
      <family>Maple Mono NF CN</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
</fontconfig>
