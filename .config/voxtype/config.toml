# Voxtype — deviations from the built-in defaults only. `voxtype config`
# prints the resolved configuration and `voxtype config schema` documents
# every key, so the stock commented template is not kept here.

engine = "parakeet"

[parakeet]
model = "parakeet-tdt-0.6b-v2"

[hotkey]
# Mango's Super+V binding runs `voxtype record start/stop` instead.
enabled = false

[audio]
# Pause MPRIS players while recording, then resume only the ones paused here.
pause_media = true

[output]
# ydotool sends raw US keycodes via /dev/uinput, which is only correct while
# mango is on "us" -- hence the layout hooks below.
driver_order = ["ydotool", "wtype", "clipboard"]

# Consecutive dictation segments must not run together.
append_text = " "

# Switch mango to the US layout for the duration of typing, then restore the
# previous one.
pre_output_command = "voxtype-layout hold"
post_output_command = "voxtype-layout release"

[output.notification]
on_transcription = false

[text.replacements]
"way bar" = "Waybar"
"row fee" = "Rofi"
"ghosty" = "Ghostty"
