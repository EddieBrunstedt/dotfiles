# Only differences from the defaults; see `voxtype config schema`.

engine = "parakeet"

[parakeet]
model = "parakeet-tdt-0.6b-v2"

# Mango binds Super+V instead.
[hotkey]
enabled = false

[audio]
pause_media = true

[output]
driver_order = ["ydotool", "wtype", "clipboard"]
append_text = " "
# ydotool types US keycodes, so switch to US while typing.
pre_output_command = "voxtype-layout hold"
post_output_command = "voxtype-layout release"

[output.notification]
on_transcription = false

[text.replacements]
"way bar" = "Waybar"
"row fee" = "Rofi"
"ghosty" = "Ghostty"
