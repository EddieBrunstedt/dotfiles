# -------- Interface
osd-font="MonoLisa, Noto Emoji"
osd-font-size=35
keep-open=yes
watch-later-options-remove=aid

# -------- Video output
vo=gpu-next
hwdec=nvdec

# -------- Scaling & quality
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
deband=yes

# Dithering
dither=fruit
dither-depth=auto
temporal-dither=yes

# -------- Playback
video-sync=display-resample
interpolation=yes
tscale=oversample

# -------- Audio
audio-channels=stereo


# -------- HDR profile (auto-applied when HDR is detected)
[HDR]
profile-desc="HDR tone mapping and color adjustments"
profile-cond=p["video-params/primaries"] == "bt.2020" or p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
profile-restore=copy
osd-playing-msg="HDR Profile Active"
tone-mapping=bt.2446a
hdr-compute-peak=yes
hdr-peak-percentile=99.995
hdr-contrast-recovery=0.30
allow-delayed-peak-detect=no

contrast=5
brightness=0
gamma=0
saturation=0

# -------- Headphone surround profiles

[headphones-5.1]
profile-desc="5.1 to headphones (virtual surround via HRTF)"
profile-restore=copy
osd-playing-msg="5.1 Headphone Surround Active"
af=lavfi=[pan=5.1|FL=FL|FR=FR|FC=2*FC|LFE=LFE|BL=BL|BR=BR],lavfi=[sofalizer=sofa=/home/nilo/.config/mpv/ClubFritz6.sofa:type=freq:radius=1.0],lavfi=[volume=2.0]

[headphones-7.1]
profile-desc="7.1 to headphones (virtual surround via HRTF)"
profile-restore=copy
osd-playing-msg="7.1 Headphone Surround Active"
af=lavfi=[pan=7.1|FL=FL|FR=FR|FC=2*FC|LFE=LFE|BL=BL|BR=BR|SL=SL|SR=SR],lavfi=[sofalizer=sofa=/home/nilo/.config/mpv/ClubFritz6.sofa:type=freq:radius=1.0],lavfi=[volume=2.0]
