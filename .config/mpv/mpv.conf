osd-font="MonoLisa, Noto Emoji"
osd-font-size=45

keep-open=yes
watch-later-options-remove=aid

# Performance
hwdec=nvdec

# Default SDR behavior (applies to everything unless overridden)
brightness=0
contrast=0
gamma=0
saturation=1

audio-channels=stereo

# HDR-specific overrides (applied automatically when HDR is detected)
[HDR]
tone-mapping=st2094-10
hdr-compute-peak=yes
brightness=8
contrast=1
gamma=0
saturation=10
hdr-peak-percentile=99.995
hdr-contrast-recovery=0.30
allow-delayed-peak-detect=no

# Output & Scaling
vo=gpu-next
scale=ewa_lanczos4sharpest
cscale=ewa_lanczos4sharpest
dither=fruit
dither-depth=auto
correct-downscaling=yes
linear-downscaling=yes
deband=yes
temporal-dither=yes
sigmoid-upscaling=yes

# Smooth Playback
video-sync=display-resample
interpolation=yes
tscale=oversample

# 5.1 specific
[5.1-audio]
af=lavfi=[pan=5.1|FL=FL|FR=FR|FC=2*FC|LFE=LFE|BL=BL|BR=BR],lavfi=[sofalizer=sofa=/home/nilo/desktop/ClubFritz6.sofa:type=freq:radius=1.0],lavfi=[volume=5.0]

# 7.1 specific
[7.1-audio]
af=lavfi=[pan=7.1|FL=FL|FR=FR|FC=2*FC|LFE=LFE|BL=BL|BR=BR|SL=SL|SR=SR],lavfi=[sofalizer=sofa=/home/nilo/desktop/ClubFritz6.sofa:type=freq:radius=1.0],lavfi=[volume=5.0]
