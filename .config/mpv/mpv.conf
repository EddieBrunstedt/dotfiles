# -------- Video output
vo=gpu-next
hwdec=nvdec

# -------- Scaling & quality
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
deband=yes

# Dithering
dither=fruit
dither-depth=auto
temporal-dither=yes

# -------- Playback
keep-open=yes
video-sync=display-resample
interpolation=yes
tscale=oversample

# -------- Audio
audio-channels=stereo
alang=eng,en

# -------- OSD
osd-font=Fira Sans Medium

# -------- Scripts
# Detects black bars encoded into the picture (e.g. a 2.4:1 film in a 16:9
# frame) and sets video-crop, so the video fits the window without panscan.
# Off by default: Shift+C crops, Shift+C again restores the full frame.
script=/usr/share/mpv/scripts/autocrop.lua
script-opts-append=autocrop-auto=no

# -------- HDR profile (auto-applied when HDR is detected)
[HDR]
profile-desc="HDR tone mapping and color adjustments"
profile-cond=p["video-params/primaries"] == "bt.2020" or p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
profile-restore=copy
osd-playing-msg="HDR Profile Active"
tone-mapping=spline
gamut-mapping-mode=auto
hdr-compute-peak=yes
hdr-peak-percentile=99.995
hdr-contrast-recovery=1.0
allow-delayed-peak-detect=no

contrast=2
brightness=2
gamma=2
saturation=0

# -------- Headphone surround profiles
# The sofa= paths below are absolute because the filter graph is passed to
# libavfilter verbatim: neither mpv nor ffmpeg expands `~` inside it.
#
# The surround maps read BL/BR *and* SL/SR: AC3/DTS/AAC 5.1 tracks often
# decode as `5.1(side)` (SL/SR, no BL/BR), and pan silently zeroes channels
# the input lacks, which drops the surrounds without any warning.

[headphones-5.1]
profile-desc="5.1 to headphones (virtual surround via HRTF)"
profile-restore=copy
osd-playing-msg="5.1 Headphone Surround Active"
af=lavfi=[pan=5.1|FL=0.707*FL|FR=0.707*FR|FC=FC|LFE=0.707*LFE|BL=0.707*BL+0.707*SL|BR=0.707*BR+0.707*SR],lavfi=[sofalizer=sofa=/home/nilo/.config/mpv/ClubFritz6.sofa:type=freq:radius=1.0],lavfi=[volume=4.0]

[headphones-7.1]
profile-desc="7.1 to headphones (virtual surround via HRTF)"
profile-restore=copy
osd-playing-msg="7.1 Headphone Surround Active"
# volume=8.0, not 4.0: sofalizer attenuates by 3 dB per input channel, so the
# 8-channel path lands exactly 6 dB below the 6-channel one for identical
# audio. The extra 6 dB here matches the 5.1 profile's loudness.
af=lavfi=[pan=7.1|FL=0.707*FL|FR=0.707*FR|FC=FC|LFE=0.707*LFE|BL=0.707*BL|BR=0.707*BR|SL=0.707*SL|SR=0.707*SR],lavfi=[sofalizer=sofa=/home/nilo/.config/mpv/ClubFritz6.sofa:type=freq:radius=1.0],lavfi=[volume=8.0]

# -------- Speaker surround profiles

[speakers-5.1]
profile-desc="5.1 downmix to stereo speakers"
profile-restore=copy
osd-playing-msg="5.1 Speaker Downmix Active"
af=lavfi=[pan=stereo|FL=FL+0.707*FC+0.707*LFE+0.5*BL+0.5*SL|FR=FR+0.707*FC+0.707*LFE+0.5*BR+0.5*SR],lavfi=[volume=1.0]

[speakers-7.1]
profile-desc="7.1 downmix to stereo speakers"
profile-restore=copy
osd-playing-msg="7.1 Speaker Downmix Active"
af=lavfi=[pan=stereo|FL=FL+0.707*FC+0.707*LFE+0.5*SL+0.5*BL|FR=FR+0.707*FC+0.707*LFE+0.5*SR+0.5*BR],lavfi=[volume=1.0]
