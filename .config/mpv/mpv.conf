keep-open=yes

# Performance
hwdec=nvdec

# Default SDR behavior (applies to everything unless overridden)
brightness=0
contrast=0
gamma=0
saturation=1

# HDR-specific overrides (applied automatically when HDR is detected)
[HDR]
profile-cond=get("video-params/primaries") == "bt.2020" or get("video-params/hdr-format") ~= nil
tone-mapping=st2094-10
hdr-compute-peak=yes
brightness=8
contrast=1
gamma=0
saturation=10
hdr-peak-percentile=99.995
hdr-contrast-recovery=0.30
allow-delayed-peak-detect=no

# Output & Scaling
vo=gpu-next
scale=ewa_lanczos4sharpest
cscale=ewa_lanczos4sharpest
dither=fruit
dither-depth=auto
correct-downscaling=yes
linear-downscaling=yes
deband=yes
temporal-dither=yes
sigmoid-upscaling=yes

# Smooth Playback
video-sync=display-resample
interpolation=yes
tscale=oversample
