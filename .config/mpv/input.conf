l seek 5
h seek -5
j seek -60
k seek 60
S cycle sub

# Resize subtitle font size
shift+t add sub-scale 0.1
shift+r add sub-scale -0.1

Alt+0 apply-profile default ; show-text "Reset to Default Profile"
Alt+1 apply-profile 5.1-audio
Alt+2 apply-profile 7.1-audio
Alt+h apply-profile HDR

Alt+i show-text "Audio: ${audio-params/channel-count}ch | Filter: ${af}"

CTRL+1 set tone-mapping "linear" ; show-text "Tone Mapping: Linear"
CTRL+2 set tone-mapping "bt.2390" ; show-text "Tone Mapping: BT.2390"
CTRL+3 set tone-mapping "bt.2446a" ; show-text "Tone Mapping: BT.2446a"
CTRL+4 set tone-mapping "spline" ; show-text "Tone Mapping: Spline"
CTRL+5 set tone-mapping "hable" ; show-text "Tone Mapping: Hable"
CTRL+6 set tone-mapping "mobius" ; show-text "Tone Mapping: Mobius"
CTRL+7 set tone-mapping "gamma" ; show-text "Tone Mapping: Gamma"
CTRL+8 set tone-mapping "reinhard" ; show-text "Tone Mapping: Reinhard"
CTRL+9 set tone-mapping "clip" ; show-text "Tone Mapping: Clip"
CTRL+0 set tone-mapping "st2094-40" ; show-text "Tone Mapping: ST.2094-40"
CTRL+- set tone-mapping "st2094-10" ; show-text "Tone Mapping: ST.2094-10"
CTRL+= set tone-mapping "auto" ; show-text "Tone Mapping: Auto"

CTRL+p show-text "Primaries: ${video-params/primaries}"
