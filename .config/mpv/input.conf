# Navigation
l seek 4 exact
h seek -4 exact
j seek -30
k seek 30
S cycle sub

# Subtitle adjustments
Shift+t add sub-scale 0.1
Shift+r add sub-scale -0.1

# Audio profile menu
a script-binding console/enable; script-message-to console type "apply-profile "

# Quick audio profile access
Alt+h apply-profile headphones-5.1 ; show-text "5.1 Headphone Surround"
Alt+H apply-profile headphones-7.1 ; show-text "7.1 Headphone Surround"
Alt+s apply-profile speakers-5.1 ; show-text "5.1 Speaker Downmix"
Alt+S apply-profile speakers-7.1 ; show-text "7.1 Speaker Downmix"
Alt+0 set af "" ; show-text "Audio Profile Disabled (standard stereo)"

# HDR tone-mapping options
Ctrl+1 set tone-mapping "auto" ; show-text "Tone Mapping: Auto"
Ctrl+2 set tone-mapping "clip" ; show-text "Tone Mapping: Clip"
Ctrl+3 set tone-mapping "mobius" ; show-text "Tone Mapping: Mobius"
Ctrl+4 set tone-mapping "reinhard" ; show-text "Tone Mapping: Reinhard"
Ctrl+5 set tone-mapping "hable" ; show-text "Tone Mapping: Hable"
Ctrl+6 set tone-mapping "bt.2390" ; show-text "Tone Mapping: BT.2390"
Ctrl+7 set tone-mapping "gamma" ; show-text "Tone Mapping: Gamma"
Ctrl+8 set tone-mapping "linear" ; show-text "Tone Mapping: Linear"
Ctrl+9 set tone-mapping "spline" ; show-text "Tone Mapping: Spline"
Ctrl+0 set tone-mapping "bt.2446a" ; show-text "Tone Mapping: BT.2446a"
Ctrl+- set tone-mapping "st2094-40" ; show-text "Tone Mapping: ST.2094-40"
Ctrl+= set tone-mapping "st2094-10" ; show-text "Tone Mapping: ST.2094-10"
