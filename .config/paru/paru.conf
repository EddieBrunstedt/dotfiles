# paru reads the first config it finds and does not merge with /etc/paru.conf,
# so this file must be complete. See paru.conf(5).

[options]
PgpFetch
Devel
Provides
DevelSuffixes = -git -cvs -svn -bzr -darcs -always -hg -fossil
BottomUp
RemoveMake
NewsOnUpgrade
CombinedUpgrade
BatchInstall
CleanAfter

[bin]
FileManager = yazi
