#
# ~/.config/paru/paru.conf
#
# paru uses the FIRST config it finds -- $PARU_CONF, then this file, then
# /etc/paru.conf -- and does not merge them. So this file must carry every
# setting, not just the ones that differ from the packaged default.
#
# See the paru.conf(5) manpage for options.
#

#
# GENERAL OPTIONS
#
[options]
PgpFetch
Devel
Provides
DevelSuffixes = -git -cvs -svn -bzr -darcs -always -hg -fossil
#AurOnly
BottomUp

# Drop makedepends once a build finishes, so meson/ninja/scdoc and friends
# stop piling up as orphans. The cost is refetching that toolchain on the
# next rebuild of the -git packages. Set to `ask` for a per-build prompt.
RemoveMake

# Arch news items are where manual-intervention notices appear, so print
# them during sysupgrade rather than finding out afterwards.
NewsOnUpgrade

# Periodically refreshes the sudo timestamp so long builds don't stall on a
# password prompt.
#SudoLoop

# Refresh first, then present repo and AUR upgrades as a single operation.
# Also fixes ordering when an AUR package needs a just-upgraded repo lib.
CombinedUpgrade

# Install built AUR packages in one pacman transaction instead of one call
# per package.
BatchInstall

# Drop untracked build files after installing so ~/.cache/paru stops
# growing. Directories survive, so VCS packages still pull incrementally
# instead of re-cloning from scratch.
CleanAfter

#UseAsk
#SaveChanges
#UpgradeMenu

#LocalRepo
#Chroot
#Sign
#SignDb
#KeepRepoCache

#
# Binary OPTIONS
#
[bin]
FileManager = yazi
#MFlags = --skippgpcheck
#Sudo = doas
