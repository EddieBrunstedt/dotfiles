# Retro CRT look, toggled by ghostty-retro via the retro-on.conf symlink.

# Shaders run in order: cursor glow first so the tube distorts it too,
# flicker last so it moves the finished picture.
custom-shader = ~/.config/ghostty/shaders/crt_cursor.glsl
custom-shader = ~/.config/ghostty/shaders/crt.glsl
custom-shader = ~/.config/ghostty/shaders/crt_glow.glsl
custom-shader = ~/.config/ghostty/shaders/crt_flicker.glsl

theme = Retro Legends

# The empty value clears the family list instead of appending to it.
# DepartureMono supplies the Nerd Font icons Fixedsys lacks.
font-family = ""
font-family = "Fixedsys Excelsior"
font-family = "DepartureMono Nerd Font"
font-family = "monospace"
# 18pt = 1.5 screen px per font px. crt.glsl's SCALE must stay 12 / font-size.
font-size = 18

# Multiples of 9 and unbalanced, so font pixels line up with the scanlines.
window-padding-x = 27
window-padding-y = 18
window-padding-balance = false
