# Retro CRT look. Loaded only while ~/.config/ghostty/retro-on.conf links
# here; `ghostty-retro` (Super+Shift+r) flips that link and live-reloads
# every open window.

# Shaders run in this order. The cursor afterglow goes first so the tube
# curves and scanlines it like the text; the flicker goes last so it moves
# the finished picture.
custom-shader = ~/.config/ghostty/shaders/crt_cursor.glsl

# Shadow mask, tube curvature and scanlines, one scanline per pixel row of
# the font (see font-size).
custom-shader = ~/.config/ghostty/shaders/crt.glsl

# Phosphor glow: a soft halo around bright text, after the scanlines like
# the light spreading in the glass.
custom-shader = ~/.config/ghostty/shaders/crt_glow.glsl

# Slight brightness flicker.
custom-shader = ~/.config/ghostty/shaders/crt_flicker.glsl

# Green phosphor, after cool-retro-term.
theme = Retro Legends

# Bitmap-era system font redrawn pixel for pixel. Departure Mono and 3270
# both looked like modern redraws rather than a tube. The empty value clears
# the family list instead of appending to it.
font-family = ""
font-family = "Fixedsys Excelsior"
# Fixedsys Excelsior has no Nerd Font icons. Departure Mono's are drawn for its own
# cells, so icons keep a gap before the file name (Maple Mono's, borrowed
# via monospace, fill it); being a pixel font it also suits anything else
# Fixedsys lacks. monospace stays as the last resort.
font-family = "DepartureMono Nerd Font"
font-family = "monospace"
# Fixedsys is drawn on a 16 px em, and Ghostty sizes fonts at 96 dpi, so
# 18pt is 24 px and every font pixel is 1.5 screen pixels. crt.glsl draws
# one scanline per font pixel row and resamples the font on that grid, so
# its SCALE must stay 12 / font-size (24pt would be 0.5, but too big).
font-size = 18

# Keep text clear of the darkened, curved edges of the tube. Both values
# must stay multiples of 9 (a whole number of 1.5-pixel font pixels) and
# padding unbalanced, so the font pixels start on crt.glsl's scanline grid.
window-padding-x = 27
window-padding-y = 18
window-padding-balance = false
