# Retro CRT look, toggled by ghostty-retro via the retro-on.conf symlink.

custom-shader = ~/.config/ghostty/shaders/retro.glsl

# Fixedsys is drawn on a 16 px grid, so 24pt puts each font pixel on
# exactly 2x2 screen pixels; retro.glsl's PIXEL must match.
# The empty value clears the family list instead of appending to it.
font-family = ""
font-family = "Fixedsys Excelsior"
font-family = "DepartureMono Nerd Font"
font-size = 24

# Room for the rounded tube edge; even, so font rows meet the scanlines.
window-padding-x = 32
window-padding-y = 24
window-padding-balance = false

# The main config's extend would smear edge cells' colours over the tube edge.
window-padding-color = background

# Fixedsys has no bold face; old terminals showed bold as brighter instead.
bold-color = bright
