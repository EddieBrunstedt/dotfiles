# Session-wide defaults, read by `systemd --user` at startup. This is the layer
# that reaches user services and GUI apps — xdg-open, mimeapps handlers, dunst
# actions, waybar's on-click commands — none of which ever source a shell
# profile. See ~/.profile for how the environment layers divide up.
#
# Format notes (this is NOT a shell script, and NOT a unit file):
#   - plain KEY=value only; no command substitution, no `export`
#   - ${VAR} expands, but only against variables already set at generator time
#   - unit-file specifiers (%h, %t) are NOT expanded here — use ${HOME} and
#     ${XDG_RUNTIME_DIR}. A stray %h would be stored literally.
#   - C escapes like \x1b are NOT interpreted; they stay literal
# Anything needing those belongs in ~/.config/uwsm/env (shell) or fish config.
#
# Apply without logging out:  systemctl --user daemon-reload
# (only affects units started afterwards)

XDG_CONFIG_HOME=${HOME}/.config

# Default applications. READER/TERMINAL/BROWSER are read by scripts in
# ~/.local/bin and by xdg-open's fallbacks.
ALTERNATE_EDITOR=nvim
BROWSER=librewolf
EDITOR=nvim
READER=zathura
TERMINAL=ghostty
VISUAL=nvim

# ssh-agent.socket (a user unit) owns this path; point every client at it.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket

# pnpm's install root. The matching PATH entry is added in ~/.profile.
PNPM_HOME=${HOME}/.local/share/pnpm

# How sops finds the age identity that decrypts ~/.secret/*.sops.yaml. A command
# string, not a secret. Set here so every user unit inherits it — waybar's
# protonmail shim needs it. See ~/.secret/README.md.
SOPS_AGE_KEY_CMD=secret-tool lookup xdg:schema dev.dotfiles.age name sops

# LESS_TERMCAP_* are deliberately not here: raw ESC bytes, which this format
# cannot express. They live in ~/.profile.
LESS=-RFX
LESSOPEN=| /usr/bin/highlight -O ansi %s 2>/dev/null
MANWIDTH=80

# fzf, for direct `fzf` invocations. Values are unquoted on purpose: this format
# takes the rest of the line literally, so quotes would become part of the
# value. The fzf.fish plugin's own settings (fzf_fd_opts, fzf_preview_dir_cmd)
# are fish variables, not environment, and stay in fish config.
FZF_DEFAULT_COMMAND=fd --type f --hidden --follow --exclude=.git
FZF_DEFAULT_OPTS=--height=50% --layout=reverse --border --cycle --info=inline

# batdiff renders through delta.
BATDIFF_USE_DELTA=true

# Not in fish config: a desktop entry or IDE extension launches `claude`
# straight from the session, where no fish config has run.
CLAUDE_CODE_DISABLE_AUTO_MEMORY=1
CLAUDE_CODE_NO_FLICKER=1
