# Session-wide variables, read by systemd --user (so GUI apps and units see them).
# Plain KEY=value: no shell, no %h specifiers, no escapes. See README.md.
# Apply: systemctl --user daemon-reload (affects units started afterwards).

XDG_CONFIG_HOME=${HOME}/.config

# ── Default apps ──
BROWSER=librewolf
EDITOR=nvim
TERMINAL=ghostty
VISUAL=nvim

# ── Tools ──
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
PNPM_HOME=${HOME}/.local/share/pnpm
SOPS_AGE_KEY_CMD=secret-tool lookup xdg:schema dev.dotfiles.age name sops

# LESS_TERMCAP_* need raw escapes, so they are in ~/.profile.
LESS=-RFX
LESSOPEN=| /usr/bin/highlight -O ansi %s 2>/dev/null
MANWIDTH=80

FZF_DEFAULT_COMMAND=fd --type f --hidden --follow --exclude=.git
FZF_DEFAULT_OPTS=--height=50% --layout=reverse --border --cycle --info=inline

# Here rather than fish, so claude launched outside a shell sees them.
CLAUDE_CODE_DISABLE_AUTO_MEMORY=1
CLAUDE_CODE_NO_FLICKER=1
