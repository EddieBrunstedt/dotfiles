# Toolkit and cursor theming for the whole user session.

# Qt apps follow the GTK theme (see ~/.config/gtk-3.0/settings.ini).
QT_QPA_PLATFORMTHEME=gtk3

# Cursor. Previously only GTK knew about capitaine (via gtk-cursor-theme-name),
# while XCURSOR_THEME was unset and XCURSOR_SIZE was mango's default 24 — so
# GTK apps drew capitaine at 31 and the compositor, Xwayland and every non-GTK
# toolkit drew Adwaita at 24. Setting them here fixes both halves at once:
# mango inherits these, and `uwsm finalize` re-exports them (the uwsm mango
# plugin lists XCURSOR_SIZE/XCURSOR_THEME in UWSM_FINALIZE_VARNAMES).
#
# Unified on 24 rather than 31: it is mango's built-in cursor_size default, so
# nothing has to be overridden in config.conf, and it is the size Xwayland and
# the compositor already render. To go bigger instead, change all three of
# XCURSOR_SIZE, `cursor_size` in mango's config.conf, and gtk-cursor-theme-size
# in both gtk-3.0/ and gtk-4.0/settings.ini.
XCURSOR_THEME=capitaine-cursors
XCURSOR_SIZE=24
