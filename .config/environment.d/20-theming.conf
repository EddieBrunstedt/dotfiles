# Toolkit and cursor theming for the whole user session.

# Qt apps follow the GTK theme (see ~/.config/gtk-3.0/settings.ini).
QT_QPA_PLATFORMTHEME=gtk3

# Cursor theme and size shared by mango, Xwayland, GTK, and other toolkits.
# mango inherits these and `uwsm finalize` re-exports them (the uwsm mango
# plugin lists XCURSOR_SIZE/XCURSOR_THEME in UWSM_FINALIZE_VARNAMES).
#
# Size 24 because phinger ships native frames at 24/32/48/64/72/96/128 and
# nothing else. Xcursor does not interpolate between frames -- it picks the
# nearest and rescales, so an off-list size renders soft. 24 is the smallest
# frame phinger ships, so there is no step below this one.
# Any change here has to stay on that list and be mirrored in four other
# places: `cursor_size` in mango/config.conf, gtk-cursor-theme-{name,size} in
# gtk-3.0/ and gtk-4.0/settings.ini, and Inherits= in
# ~/.local/share/icons/default/index.theme (the XCursor `default` theme, used
# by anything that does not read XCURSOR_THEME).
XCURSOR_THEME=phinger-cursors-light
XCURSOR_SIZE=24
