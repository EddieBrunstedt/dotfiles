# Only settings that differ from /etc/mango/config.toml.
# Docs: https://github.com/mangowm/mango/wiki/
# Validate: mango -p -c ~/.config/mango/config.toml
#
# Mango's TOML parser is line-based: plain options must all sit in [global],
# before the first [bind.*] / [[rule.*]] table. No inline tables, dotted keys
# or """ strings, and rule values cannot contain commas.
# Session env vars go in ~/.config/uwsm/env, not an [env] table here.

[global]

# Required on NVIDIA, or Electron apps flicker. Needs a restart, not a reload.
sync_obj_enable = 1
allow_lock_transparent = 0

# ── Animations ──
animation_type_open = "zoom"
# Off in mango's built-in defaults; /etc/mango/config.toml turns it on but isn't read.
layer_animations = 1
zoom_initial_ratio = 0.3
animation_duration_move = 100
animation_duration_open = 100
animation_duration_tag = 100
animation_duration_close = 100

# ── Layout ──
# What Super+n cycles through; the rest are in the Super+a layout mode.
circle_layout = "right_tile,fair,right_deck"
smart_gaps = 1
gap_inner_horizontal = 0
gap_inner_vertical = 0
gap_outer_horizontal = 0
gap_outer_vertical = 0
# Can leave panes borderless after merging single-window tags with toggleview.
no_border_when_single = 1

# Activation requests switch to the client's tag; games opt out with is_tag_silent below.
focus_on_activate = 1

# ── Appearance ──
cursor_size = 24
border_px = 2
cursor_hide_timeout = 3
cursor_hide_on_keypress = 1

# ── Input ──
repeat_rate = 30
repeat_delay = 200
xkb_rules_options = "caps:escape"
# Scripts switch by code through kbd-layout, which reads this list.
xkb_rules_layout = "us,se,dk"

# 0=none 1=flat 2=adaptive
mouse_accel_profile = 1
mouse_accel_speed = 0.0
# Off: with zero gaps it eats clicks on scrollbars along tiled window edges.
enable_border_resize = 0

# ── Monitor ──
allow_tearing = 1

# ── Autostart ──
# Everything else is a systemd user unit, D-Bus activated or XDG autostart.
exec_once = ["uwsm finalize"]

# ══════════════════════════════════════════════════════════════════════════════
# Key bindings — "MODS+key" = "action,args"; key names from `wev`
# ══════════════════════════════════════════════════════════════════════════════
# Everything is under Super; Alt and Ctrl belong to the apps (docs/keybinds/).
# Super+key acts or focuses, +Shift takes the window along, +Ctrl is the variant.

[bind.default]

# ── Session ──
"SUPER+r" = "reload_config"
"SUPER+q" = "killclient"
"SUPER+SHIFT+q" = "killclient,force"

# ── Launchers ──
"SUPER+p" = "spawn,rofi -show drun"
"SUPER+SHIFT+Return" = "spawn,ghostty"
"SUPER+b" = "spawn,librewolf"
"SUPER+y" = "spawn,~/.local/bin/dir-menu"
"SUPER+backslash" = "toggle_named_scratchpad,com.ghostty.scratchpad,none,~/.local/bin/ghostty-scratchpad"
"SUPER+x" = "setkeymode,launch"
"XF86PowerOff" = "spawn,~/.local/bin/lock-blank"
"Print" = "spawn,~/.local/bin/screenshot"

# ── Notifications ──
"SUPER+i" = "spawn,~/.local/bin/dunst-act"
"SUPER+SHIFT+i" = "spawn,dunstctl close-all"
"SUPER+CTRL+i" = "spawn,~/.local/bin/dunst-history"

# ── Volume ──
"XF86AudioRaiseVolume" = "spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+"
"XF86AudioLowerVolume" = "spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%-"

# ── Windows: j/k run through the stack (decks have no direction), h/l go sideways ──
"SUPER+j" = "focusstack,next"
"SUPER+k" = "focusstack,prev"
"SUPER+h" = "focusdir,left"
"SUPER+l" = "focusdir,right"
"SUPER+space" = "focus_first_tiled"
"SUPER+Return" = "zoom"

"SUPER+SHIFT+j" = "exchange_stack_client,next"
"SUPER+SHIFT+k" = "exchange_stack_client,prev"
"SUPER+SHIFT+h" = "move_client,left"
"SUPER+SHIFT+l" = "move_client,right"

# Tiled windows too: sideways moves the master/stack split.
"SUPER+CTRL+h" = "resizewin,-50,+0"
"SUPER+CTRL+l" = "resizewin,+50,+0"
"SUPER+CTRL+j" = "resizewin,+0,+50"
"SUPER+CTRL+k" = "resizewin,+0,-50"

# ── Window state ──
"SUPER+f" = "togglefullscreen"
"SUPER+SHIFT+f" = "togglefakefullscreen"
"SUPER+SHIFT+space" = "togglefloating"
"SUPER+g" = "toggleglobal"
"SUPER+o" = "toggleoverlay"

# ── Special workspace ──
"SUPER+s" = "toggle_special_tag"
"SUPER+SHIFT+s" = "tag_special_tag"
"SUPER+CTRL+s" = "tag_special_silent"

# ── Window groups ──
"SUPER+ALT+h" = "groupjoin,left"
"SUPER+ALT+j" = "groupjoin,down"
"SUPER+ALT+k" = "groupjoin,up"
"SUPER+ALT+l" = "groupjoin,right"
"SUPER+bracketleft" = "groupfocus,prev"
"SUPER+bracketright" = "groupfocus,next"
"SUPER+ALT+g" = "groupleave"

# ── Switchers: hold Super, tap, release to pick ──
"SUPER+grave" = "switcher,all_next"
"SUPER+SHIFT+grave" = "switcher,all_prev"
"SUPER+CTRL+grave" = "overcircle,next"
"SUPER+CTRL+SHIFT+grave" = "overcircle,prev"
"SUPER+Up" = "toggleoverview"
"SUPER+Down" = "togglejump"

# ── Layouts: Super+n cycles circle_layout, Super+a opens the layout mode ──
"SUPER+n" = "switch_layout"
"SUPER+a" = "setkeymode,layout"

# ── Tags ──
"SUPER+Tab" = "view,-1"
"SUPER+0" = "view,00,0"
"SUPER+Left" = "viewtoleft,0"
"SUPER+Right" = "viewtoright,0"
"SUPER+SHIFT+Left" = "tagtoleft,0"
"SUPER+SHIFT+Right" = "tagtoright,0"
"SUPER+CTRL+Left" = "viewtoleft_have_client,0"
"SUPER+CTRL+Right" = "viewtoright_have_client,0"

"SUPER+1" = "view,1,0"
"SUPER+2" = "view,2,0"
"SUPER+3" = "view,3,0"
"SUPER+4" = "view,4,0"
"SUPER+5" = "view,5,0"
"SUPER+6" = "view,6,0"
"SUPER+7" = "view,7,0"
"SUPER+8" = "view,8,0"
"SUPER+9" = "view,9,0"

"SUPER+SHIFT+1" = "tagsilent,1,0"
"SUPER+SHIFT+2" = "tagsilent,2,0"
"SUPER+SHIFT+3" = "tagsilent,3,0"
"SUPER+SHIFT+4" = "tagsilent,4,0"
"SUPER+SHIFT+5" = "tagsilent,5,0"
"SUPER+SHIFT+6" = "tagsilent,6,0"
"SUPER+SHIFT+7" = "tagsilent,7,0"
"SUPER+SHIFT+8" = "tagsilent,8,0"
"SUPER+SHIFT+9" = "tagsilent,9,0"

"SUPER+CTRL+1" = "toggleview,1"
"SUPER+CTRL+2" = "toggleview,2"
"SUPER+CTRL+3" = "toggleview,3"
"SUPER+CTRL+4" = "toggleview,4"
"SUPER+CTRL+5" = "toggleview,5"
"SUPER+CTRL+6" = "toggleview,6"
"SUPER+CTRL+7" = "toggleview,7"
"SUPER+CTRL+8" = "toggleview,8"
"SUPER+CTRL+9" = "toggleview,9"

# Window shows on that tag as well.
"SUPER+CTRL+SHIFT+1" = "toggletag,1"
"SUPER+CTRL+SHIFT+2" = "toggletag,2"
"SUPER+CTRL+SHIFT+3" = "toggletag,3"
"SUPER+CTRL+SHIFT+4" = "toggletag,4"
"SUPER+CTRL+SHIFT+5" = "toggletag,5"
"SUPER+CTRL+SHIFT+6" = "toggletag,6"
"SUPER+CTRL+SHIFT+7" = "toggletag,7"
"SUPER+CTRL+SHIFT+8" = "toggletag,8"
"SUPER+CTRL+SHIFT+9" = "toggletag,9"

# ── Monitors ──
"SUPER+comma" = "focusmon,left"
"SUPER+period" = "focusmon,right"
"SUPER+SHIFT+comma" = "tagmon,left"
"SUPER+SHIFT+period" = "tagmon,right"

# ── Voxtype push-to-talk ──
# Release V before Super, or the release bind never fires.
# .conflict silences the press/release duplicate warning.
[bind.default.conflict]
"SUPER+v" = "spawn,voxtype record start"

[bind.default.release.conflict]
"SUPER+v" = "spawn,voxtype record stop"

# ── Launcher mode: Super+x, then one key ──
# Each key returns to the default mode, so the mode lasts one keypress.
[bind.launch]
"Escape" = "setkeymode,default"
"SUPER+x" = "setkeymode,default"

[bind.launch.conflict]
"a" = ["spawn,ghostty -e wiremix -s compat -v output", "setkeymode,default"]
"e" = ["spawn,~/.local/bin/emoji-menu", "setkeymode,default"]
"k" = ["spawn,~/.local/bin/keyboard-layout-menu", "setkeymode,default"]
"l" = ["spawn,~/.local/bin/lock-screen", "setkeymode,default"]
"m" = ["spawn,~/.local/bin/system-menu", "setkeymode,default"]
"n" = ["spawn,~/.local/bin/dunst-toggle", "setkeymode,default"]
"p" = ["spawn,env SHELL=/usr/bin/sh ~/.local/bin/ord_prompts", "setkeymode,default"]
"q" = ["spawn,~/.local/bin/power-menu", "setkeymode,default"]
"r" = ["spawn,~/.local/bin/ghostty-retro", "setkeymode,default"]
"s" = ["spawn,~/.local/bin/ghostty-shader-menu", "setkeymode,default"]
"t" = ["spawn,~/.local/bin/whitetemp", "setkeymode,default"]
"v" = ["spawn,~/.local/bin/mullvad-menu", "setkeymode,default"]

# ── Layout mode: Super+a, then one key ──
[bind.layout]
"Escape" = "setkeymode,default"
"SUPER+a" = "setkeymode,default"

[bind.layout.conflict]
"t" = ["setlayout,right_tile", "setkeymode,default"]
"SHIFT+t" = ["setlayout,tile", "setkeymode,default"]
"v" = ["setlayout,vertical_tile", "setkeymode,default"]
"c" = ["setlayout,center_tile", "setkeymode,default"]
"f" = ["setlayout,fair", "setkeymode,default"]
"SHIFT+f" = ["setlayout,vertical_fair", "setkeymode,default"]
"d" = ["setlayout,right_deck", "setkeymode,default"]
"SHIFT+d" = ["setlayout,deck", "setkeymode,default"]
"g" = ["setlayout,grid", "setkeymode,default"]
"m" = ["setlayout,monocle", "setkeymode,default"]
"s" = ["setlayout,scroller", "setkeymode,default"]
"x" = ["switch_proportion_preset", "setkeymode,default"]
"i" = ["incnmaster,+1", "setkeymode,default"]
"SHIFT+i" = ["incnmaster,-1", "setkeymode,default"]
"minus" = ["incgaps,-5", "setkeymode,default"]
"equal" = ["incgaps,5", "setkeymode,default"]
"0" = ["togglegaps", "setkeymode,default"]

# ── Mouse ──
[mousebind.default]
"SUPER+btn_left" = "moveresize,curmove"
"SUPER+btn_right" = "moveresize,curresize"

[axisbind.default]
"SUPER+UP" = "viewtoleft_have_client"
"SUPER+DOWN" = "viewtoright_have_client"

# ══════════════════════════════════════════════════════════════════════════════
# Rules
# ══════════════════════════════════════════════════════════════════════════════

[[rule.tag_rule]]
id = "*"
layout_name = "right_tile"

# ── Monitors ──
# Keyed on serial so another panel on DP-1 falls back to its preferred mode.
# Serials stay quoted and must not overlap: login applies the first match,
# reload the last.

# Philips (EDID prefers 60Hz)
[[rule.monitor_rule]]
name = "^DP-1$"
serial = "0x000006A3"
width = 3440
height = 1440
refresh = 99.982
vrr = 0

[[rule.monitor_rule]]
name = "^DP-1$"
serial = "EBP7M00586SL0"
width = 1920
height = 1080
refresh = 239.964
vrr = 0

# ── Windows ──
[[rule.window_rule]]
is_named_scratchpad = 1
app_id = "com.ghostty.scratchpad"
width = 0.8
height = 0.85

# Games re-activate on focus loss, which snapped the view back after Super+N;
# tag-silent turns their activation requests into the urgent flag.
[[rule.window_rule]]
is_tag_silent = 1
app_id = "^(steam_app_.*|gamescope)$"

# ── Layers ──
[[rule.layer_rule]]
animation_type_open = "zoom"
layer_name = "rofi"

[[rule.layer_rule]]
animation_type_close = "zoom"
layer_name = "rofi"

# Dunst slides in from the right edge and back out.
[[rule.layer_rule]]
animation_type_open = "slide"
layer_name = "notifications"

[[rule.layer_rule]]
animation_type_close = "slide"
layer_name = "notifications"
