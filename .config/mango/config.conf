# Mango config — only settings that DIFFER from /etc/mango/config.conf defaults.
# Anything omitted falls back to the shipped default. Full option list + defaults:
# https://github.com/DreamMaoMao/mango/wiki/

# ── Environment ──
# Deliberately empty. The NVIDIA and Wayland-toolkit variables that used to live
# here as `env=` lines now live in ~/.config/uwsm/env, because `env=` only
# reaches clients mango spawns itself — user units (ghostty's daemon,
# protonmail-bridge) and D-Bus-activated services never saw them. uwsm exports
# them into the systemd/D-Bus activation environment instead, which covers both.
#
# Add an `env=` line here only for something genuinely mango-specific that must
# NOT be visible to the rest of the session.

# ── Explicit sync (linux-drm-syncobj-v1) ──
# Required on NVIDIA: without it clients fall back to implicit sync, which the
# NVIDIA driver doesn't do properly -> flicker/stale frames in Electron apps.
# Takes effect on compositor restart (not Super+r reload).
syncobj_enable=1

# ── Animations (snappier than the languid defaults) ──
animation_type_open=zoom
zoom_initial_ratio=0.3
animation_duration_move=100
animation_duration_open=100
animation_duration_tag=100
animation_duration_close=100

# ── Layout / gaps ──
smartgaps=1
# Gapless baseline (all 0). incgaps step is 5, so Super+equal adds gaps in round
# units when wanted. gappih/iv = inner (between windows), gappoh/ov = outer (screen
# edge). NOTE: Super+a (togglemaximizescreen) reads the OUTER config values directly
# (mango.c setmaximizescreen) and ignores runtime incgaps/togglegaps — so gappoh/ov=0
# here is what makes maximize truly edge-to-edge regardless of live gap tweaks.
gappih=0
gappiv=0
gappoh=0
gappov=0
# no_border_when_single left at the default (0): with it on, a lone window has its
# stored border width destructively zeroed (animation/client.h, smartgaps path), and
# that 0 is sticky — it only restores when the window is re-laid-out. Merging single-
# window tags via toggleview (Super+Ctrl+N) then leaves panes borderless at random.
# Borders are now unconditional; use Super+a / Super+f to fill the screen on purpose.
no_border_when_single=0

# ── Focus behavior ──
# Don't let clients yank the view to their tag on activation requests.
# Fullscreen games re-activate themselves on focus loss, which made the first
# tag-switch away from them snap back (Super+1 needed two presses). Apps that
# request activation now get the urgent flag instead of stealing the view.
focus_on_activate=0
# Let focus operations cross tags, so focusstack (Super+j/k) and focusdir
# (Alt+arrows) can reach clients on other tags too, dwm-style.
# NOTE: this affects focusstack (Super+j/k) and focusdir (Alt+arrows) — they
# can now reach clients on other tags too. Set back to 0 if that feels wrong.
focus_cross_tag=1

# ── Appearance ──
cursor_size=24
borderpx=2

# ── Keyboard (repeat matches X11 AutoRepeat "200 30"; Caps Lock acts as Escape) ──
repeat_rate=30
repeat_delay=200
xkb_rules_options=caps:escape
# Layouts available to switch_keyboard_layout (used by keyboard-layout-menu)
xkb_rules_layout=us,se,dk

# ── Mouse (flat accel, no acceleration — matches X11 AccelProfile "flat") ──
# profile: 0=None 1=Flat 2=Adaptive
mouse_accel_profile=1
mouse_accel_speed=0.0

# ── Monitor ──
# Pin to the mode X11/lightdm use (1920x1080 @ 240Hz, exact 239.964) so the panel
# does not switch modes on login. Wayland names the port DP-1 (X11 calls it DP-0).
monitorrule=name:^DP-1$,width:1920,height:1080,refresh:239.964,vrr:0
# allow tearing in fullscreen apps that request it (lower input latency in games)
allow_tearing=1

# ── Autostart (exec-once runs once at startup, not on Super+r reload) ──
# Signal session readiness to uwsm and export WAYLAND_DISPLAY (+ cursor vars
# via the uwsm mango plugin) to the systemd activation environment. This lets
# graphical-session.target activate, which starts the units enabled into it
# (protonmail-bridge, ghostty daemon). Harmless no-op error outside uwsm.
exec-once=uwsm finalize
# Wallpaper via swaybg — first in autostart so the background appears before
# anything else. Uses the image at ~/Pictures/wallpapers/current, or a solid
# color until one is set. To change: replace that file (or symlink) and
# re-run the script — it restarts swaybg with the new image.
exec-once=/home/nilo/.config/mango/scripts/wallpaper
# waybar runs as a user unit (waybar.service, WantedBy graphical-session.target)
# Notifications: dunst (D-Bus activated, Type=dbus owning org.freedesktop.Notifications)
# starts itself on the first notification — no exec-once needed. WAYLAND_DISPLAY is
# already in the systemd/D-Bus env so it finds the compositor. (mako removed.)
# polkit agent (soteria) runs as a user unit (soteria.service, wanted by
# graphical-session.target, with a drop-in fixing XDG_SESSION_ID). Other
# autostarts (gnome-keyring, megasync) come from /etc/xdg/autostart/ via
# uwsm's xdg-desktop-autostart.target — don't duplicate them here.
# Proton Mail Bridge and the ghostty daemon are enabled into
# graphical-session.target, which uwsm activates once `uwsm finalize` above has
# run — no exec-once needed. (If running mango WITHOUT uwsm, start them by
# hand: systemctl --user start protonmail-bridge.service)
# Session startup: switches straight to STARTUP_TAG (set in the script — mango
# has no initial-tag option), then launches the usual apps and places each on
# its home tag (once).
# One-shot placement via mango IPC — NOT a windowrule, so ad-hoc relaunches of
# these apps during the day are left wherever you open them. This exec-once is
# the only caller; the mango-menu entry that also ran it on demand was dropped.
exec-once=/home/nilo/.config/mango/scripts/session-startup

# ── Layouts: master area on the RIGHT (dwm rmaster equivalent) ──
tagrule=id:1,layout_name:right_tile
tagrule=id:2,layout_name:right_tile
tagrule=id:3,layout_name:right_tile
tagrule=id:4,layout_name:right_tile
tagrule=id:5,layout_name:right_tile
tagrule=id:6,layout_name:right_tile
tagrule=id:7,layout_name:right_tile
tagrule=id:8,layout_name:right_tile
tagrule=id:9,layout_name:right_tile

# ══════════════════════════════════════════════════════════════════════════════
# Key Bindings  (leader = SUPER, dwm-style; a few secondary actions on ALT)
# key names: `wev` output; mod keys: super,ctrl,alt,shift,none
# ══════════════════════════════════════════════════════════════════════════════

# reload config
bind=SUPER,r,reload_config

# Voxtype push-to-talk. Keep the dedicated F13 binding for keyboards that have
# it; Super+V is the fallback chord. With Super+V, release V before Super so
# Mango still sees the modifier when matching the release binding.
bind=NONE,code:191,spawn,voxtype record start
bindr=NONE,code:191,spawn,voxtype record stop
bind=SUPER,v,spawn,voxtype record start
bindr=SUPER,v,spawn,voxtype record stop

# menu and terminal (dwm: Super+p launcher, Super+Shift+Return terminal)
bind=SUPER,p,spawn,rofi -show drun
bind=SUPER+SHIFT,Return,spawn,ghostty
# browser, opens on the current tag (session-startup places the boot instance
# on tag 2; ad-hoc launches like this one stay where you open them)
bind=SUPER,e,spawn,librewolf
# audio mixer (wiremix) in a terminal — was super+shift+a in sxhkd/X11
bind=SUPER+SHIFT,a,spawn,ghostty -e wiremix -s compat -v output
# media volume keys. wpctl (WirePlumber's own CLI) rather than pamixer/pactl:
# there is no PulseAudio daemon here, only pipewire-pulse's shim, and the
# statusbar/volume script already READS through wpctl — same tool both ways.
# -l 1.0 caps at 100%. The pkill refreshes waybar's custom/volume module
# immediately (same trick as its on-scroll handlers, which step by 2 — keys use
# a coarser 5). spawn_shell rather than spawn because the && needs a shell.
bind=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+ && pkill -RTMIN+1 waybar
bind=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%- && pkill -RTMIN+1 waybar
# dismiss all visible notifications (was super+shift+i → dunstctl close-all in sxhkd)
bind=SUPER+SHIFT,i,spawn,dunstctl close-all
# pause/unpause notifications (Do Not Disturb); updates the 🔔/🔕 waybar segment
bind=SUPER+SHIFT,n,spawn,/home/nilo/.local/bin/dunst-toggle
# white temperature picker (was super+shift+b in X11; redshift+dmenu → gammastep+rofi)
bind=SUPER+SHIFT,b,spawn,/home/nilo/.local/bin/whitetemp
# keyboard layout picker (was super+shift+k in X11; setxkbmap+dmenu → mmsg+rofi)
bind=SUPER+SHIFT,k,spawn,/home/nilo/.local/bin/keyboard-layout-menu
# Mullvad VPN controller (same chord as the old sxhkd binding)
bind=SUPER+SHIFT,s,spawn,/home/nilo/.local/bin/mullvad-menu
# emoji picker (rofi) — copies the chosen emoji to the clipboard
bind=SUPER+SHIFT,e,spawn,/home/nilo/.local/bin/emoji-menu
# full-screen screenshot with satty annotation UI — crop/save/copy in satty
bind=NONE,Print,spawn,/home/nilo/.local/bin/screenshot
# ord prompt picker (was super+shift+p in X11; dmenu → rofi)
bind=SUPER+SHIFT,p,spawn,env SHELL=/usr/bin/sh /home/nilo/.local/bin/ord_prompts
# master menu of occasional Mango/session actions (rofi). Includes the
# session-startup trigger, layout picker, power, etc.
bind=SUPER+SHIFT,m,spawn,/home/nilo/.local/bin/mango-menu

# kill focused client (dwm: Super+Shift+c). NOTE: quit bind removed on purpose —
# to stop the session, use the mango-menu (SUPER+SHIFT+m → Power… → "Stop Mango
# session") or run `uwsm stop` directly. Both stop the session units in
# dependency order; `killall mango` works too but skips the graceful teardown.
# Wrapper kills, then focuses the first visible tiled window once the client is gone
# (apps that prompt on close keep focus). Revert with: bind=SUPER+SHIFT,c,killclient,
bind=SUPER+SHIFT,c,spawn,/home/nilo/.config/mango/scripts/kill-focus-master

# focus the stack (dwm: j=down/next, k=up/prev)
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev
# Super+Tab: toggle back to the previously-viewed tagset (dwm "view 0").
# view,-1 swaps the whole previous tag selection back in, including tag
# combinations (e.g. tags 1+3), so it goes back and forth between views.
bind=SUPER,Tab,view,-1
# overview moved off Super+Tab to Super+grave (the ` key); mouse-friendly grid
bind=SUPER,grave,toggleoverview,
# directional focus kept on Alt+arrows (secondary method)
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# window groups (MangoWM 0.15+): join the neighboring tile, cycle tabs, leave group
bind=SUPER+ALT,Left,groupjoin,left
bind=SUPER+ALT,Right,groupjoin,right
bind=SUPER+ALT,Up,groupjoin,up
bind=SUPER+ALT,Down,groupjoin,down
bind=SUPER,bracketleft,groupfocus,prev
bind=SUPER,bracketright,groupfocus,next
bind=SUPER+ALT,g,groupleave,

# master / layout (dwm: h/l mfact, Return zoom)
bind=SUPER,h,setmfact,-0.05
bind=SUPER,l,setmfact,+0.05
bind=SUPER,Return,zoom,
bind=SUPER,n,switch_layout
# Layoyt bindings
bind=SUPER,t,setlayout,right_tile
bind=SUPER+SHIFT,t,setlayout,tile
bind=SUPER,m,setlayout,vertical_tile
bind=SUPER,u,setlayout,center_tile
bind=SUPER,w,setlayout,fair
bind=SUPER+SHIFT,w,setlayout,vertical_fair
# deck layout (waybar shows [K]); stack windows stacked full-size, focused on top
bind=SUPER,c,setlayout,deck
# focus the first visible tiled window in layout order
bind=SUPER,space,focus_first_tiled

# swap window position
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER+SHIFT,space,togglefloating,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,g,toggleglobal,
bind=SUPER,o,toggleoverlay,
# Quake-style dropdown terminal (named scratchpad). Super+\ launches a
# dedicated ghostty (appid com.ghostty.scratchpad) on first press, then
# toggles its visibility. Distinct appid keeps it isolated from normal
# ghostty windows; the windowrule below sizes/centers it as a floating pad.
bind=SUPER,backslash,toggle_named_scratchpad,com.ghostty.scratchpad,none,/home/nilo/.local/bin/ghostty-scratchpad
windowrule=isnamedscratchpad:1,appid:com.ghostty.scratchpad,width:1536,height:918

# scroller layout (left on Alt - secondary layout, low priority)
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# tag navigation (cycle current monitor's view left/right)
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

# tags (dwm: Super+N view tag, Super+Shift+N move window to tag)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# toggleview (dwm: Super+Ctrl+N shows tag N alongside the current view)
bind=SUPER+CTRL,1,toggleview,1
bind=SUPER+CTRL,2,toggleview,2
bind=SUPER+CTRL,3,toggleview,3
bind=SUPER+CTRL,4,toggleview,4
bind=SUPER+CTRL,5,toggleview,5
bind=SUPER+CTRL,6,toggleview,6
bind=SUPER+CTRL,7,toggleview,7
bind=SUPER+CTRL,8,toggleview,8
bind=SUPER+CTRL,9,toggleview,9

bind=SUPER+SHIFT,1,tagsilent,1,0
bind=SUPER+SHIFT,2,tagsilent,2,0
bind=SUPER+SHIFT,3,tagsilent,3,0
bind=SUPER+SHIFT,4,tagsilent,4,0
bind=SUPER+SHIFT,5,tagsilent,5,0
bind=SUPER+SHIFT,6,tagsilent,6,0
bind=SUPER+SHIFT,7,tagsilent,7,0
bind=SUPER+SHIFT,8,tagsilent,8,0
bind=SUPER+SHIFT,9,tagsilent,9,0

# monitor switch (dwm: Super+comma/period focus, +Shift to move client)
bind=SUPER,comma,focusmon,left
bind=SUPER,period,focusmon,right
bind=SUPER+SHIFT,comma,tagmon,left
bind=SUPER+SHIFT,period,tagmon,right

# gaps (dwm: Super+minus/equal, Super+Shift+equal toggles)
bind=SUPER,minus,incgaps,-5
bind=SUPER,equal,incgaps,5
bind=SUPER+SHIFT,equal,togglegaps

# movewin (floating windows) — UNBOUND on purpose. Ctrl+Shift+arrows is a near-
# universal text-editing shortcut (word/line selection in editors, Obsidian, etc.);
# binding it at the compositor stole it from every app. Move floating windows with
# the mouse instead: Super+left-drag (mousebind below). Re-add on a WM-only modifier
# like SUPER+ALT+arrows if you want keyboard nudging back.

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
# btn_middle intentionally left unbound so apps (browsers etc.) keep middle-click.
# Use Super+a (togglemaximizescreen) instead.
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
