# Mango config — only settings that DIFFER from /etc/mango/config.conf defaults.
# Anything omitted falls back to the shipped default. Full option list + defaults:
# https://github.com/DreamMaoMao/mango/wiki/

# ── Environment ──
# Deliberately empty: `env=` only reaches clients mango spawns itself, so user
# units and D-Bus-activated services never see it. Session-wide variables belong
# in ~/.config/uwsm/env. Add `env=` here only for something mango-specific that
# must NOT be visible to the rest of the session.

# ── Explicit sync (linux-drm-syncobj-v1) ──
# Required on NVIDIA: without it clients fall back to implicit sync, which the
# NVIDIA driver doesn't do properly -> flicker/stale frames in Electron apps.
# Takes effect on compositor restart, not on Super+r reload.
syncobj_enable=1

# ── Session locking ──
# Already the default; pinned so a change to the shipped config cannot make the
# lock screen transparent.
allow_lock_transparent=0

# ── Animations ──
animation_type_open=zoom
zoom_initial_ratio=0.3
animation_duration_move=100
animation_duration_open=100
animation_duration_tag=100
animation_duration_close=100

# ── Layout / gaps ──
# gappih/iv = inner (between windows), gappoh/ov = outer (screen edge). Super+a
# (togglemaximizescreen) reads the OUTER values directly and ignores runtime
# incgaps/togglegaps, so gappoh/ov=0 is what makes maximize edge-to-edge even
# after live gap tweaks.
smartgaps=1
gappih=0
gappiv=0
gappoh=0
gappov=0
# Leave at 0. With it on, a lone window's stored border width is destructively
# zeroed and stays 0 until the window is re-laid-out, so merging single-window
# tags via toggleview (Super+Ctrl+N) leaves panes borderless at random.
no_border_when_single=0

# ── Focus behavior ──
# Don't let clients yank the view to their tag on activation requests: fullscreen
# games re-activate themselves on focus loss, which made the first tag-switch
# away from them snap back. Such apps get the urgent flag instead.
focus_on_activate=0
# Lets focusstack (Super+j/k) and focusdir (Alt+arrows) reach clients on other
# tags, not just the visible ones.
focus_cross_tag=1

# ── Appearance ──
cursor_size=24
borderpx=2
# Hide the pointer after 3s idle, and immediately when typing. Only pointer input
# brings it back (motion/click/scroll), not keys. 0 disables.
cursor_hide_timeout=3
cursor_hide_on_keypress=1

# ── Keyboard ──
repeat_rate=30
repeat_delay=200
xkb_rules_options=caps:escape
# Layouts offered by switch_keyboard_layout, which keyboard-layout-menu drives.
xkb_rules_layout=us,se,dk

# ── Mouse ──
# profile: 0=None 1=Flat 2=Adaptive
mouse_accel_profile=1
mouse_accel_speed=0.0

# ── Monitor ──
# Pinned to the panel's native mode so it does not switch modes on login.
monitorrule=name:^DP-1$,width:1920,height:1080,refresh:239.964,vrr:0
# Allow tearing in fullscreen apps that request it (lower input latency in games).
allow_tearing=1

# ── Autostart ──
# exec-once runs at startup only, not on Super+r reload.
#
# Nothing else belongs here: waybar, soteria, the wallpaper and the ghostty
# daemon are user units wanted by graphical-session.target, dunst and the
# FileManager1 provider are D-Bus activated, and gnome-keyring/megasync come
# from /etc/xdg/autostart via uwsm's xdg-desktop-autostart.target.
#
# Signals session readiness to uwsm and exports WAYLAND_DISPLAY into the systemd
# activation environment, which is what lets graphical-session.target start.
# Harmless no-op outside uwsm.
exec-once=uwsm finalize
# Places the startup apps on their home tags via one-shot IPC rather than
# windowrules, so ad-hoc relaunches stay where you open them.
exec-once=~/.config/mango/scripts/session-startup

# ── Layouts: master area on the RIGHT ──
tagrule=id:1,layout_name:right_tile
tagrule=id:2,layout_name:right_tile
tagrule=id:3,layout_name:right_tile
tagrule=id:4,layout_name:right_tile
tagrule=id:5,layout_name:right_tile
tagrule=id:6,layout_name:right_tile
tagrule=id:7,layout_name:right_tile
tagrule=id:8,layout_name:right_tile
tagrule=id:9,layout_name:right_tile

# ══════════════════════════════════════════════════════════════════════════════
# Key Bindings  (leader = SUPER; a few secondary actions on ALT)
# key names: `wev` output; mod keys: super,ctrl,alt,shift,none
# ══════════════════════════════════════════════════════════════════════════════

# ── Session ──
bind=SUPER,r,reload_config
# There is no compiled-in default for killclient — /etc/mango/config.conf is only
# read when this file is absent — so without this bind nothing closes a window.
# Stopping the session is deliberately unbound; use mango-menu → Power… or
# `uwsm stop`, both of which tear down in order.
bind=SUPER+SHIFT,c,killclient,

# ── Launchers and menus ──
bind=SUPER,p,spawn,rofi -show drun
bind=SUPER+SHIFT,Return,spawn,ghostty
bind=SUPER,e,spawn,librewolf
# Wrapper, not swaylock directly: it switches the keyboard to US first.
bind=SUPER+SHIFT,l,spawn,~/.local/bin/lock-screen
bind=SUPER+SHIFT,a,spawn,ghostty -e wiremix -s compat -v output
bind=SUPER+SHIFT,b,spawn,~/.local/bin/whitetemp
bind=SUPER+SHIFT,k,spawn,~/.local/bin/keyboard-layout-menu
bind=SUPER+SHIFT,s,spawn,~/.local/bin/mullvad-menu
bind=SUPER+SHIFT,e,spawn,~/.local/bin/emoji-menu
bind=SUPER+SHIFT,p,spawn,env SHELL=/usr/bin/sh ~/.local/bin/ord_prompts
bind=SUPER+SHIFT,m,spawn,~/.local/bin/mango-menu
bind=NONE,Print,spawn,~/.local/bin/screenshot

# ── Notifications ──
bind=SUPER+SHIFT,i,spawn,dunstctl close-all
# Do Not Disturb; updates the 🔔/🔕 waybar segment.
bind=SUPER+SHIFT,n,spawn,~/.local/bin/dunst-toggle

# ── Media and hardware keys ──
# wpctl because there is no PulseAudio daemon here, only pipewire-pulse's shim,
# and waybar's volume module already reads through wpctl. -l 1.0 caps at 100%;
# the pkill refreshes that module immediately. spawn_shell because && needs a shell.
bind=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+ && pkill -RTMIN+1 waybar
bind=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%- && pkill -RTMIN+1 waybar
# Voxtype push-to-talk. F13 (code 191) for keyboards that have it, Super+V as the
# fallback chord — with Super+V, release V before Super, or mango never matches
# the release binding and recording never stops.
bind=NONE,code:191,spawn,voxtype record start
bindr=NONE,code:191,spawn,voxtype record stop
bind=SUPER,v,spawn,voxtype record start
bindr=SUPER,v,spawn,voxtype record stop

# ── Focus ──
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev
bind=SUPER,space,focus_first_tiled
# Swaps the whole previous tag selection back in, including combinations
# (e.g. tags 1+3), so it toggles between two views.
bind=SUPER,Tab,view,-1
bind=SUPER,grave,toggleoverview,
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# ── Window groups ──
bind=SUPER+ALT,Left,groupjoin,left
bind=SUPER+ALT,Right,groupjoin,right
bind=SUPER+ALT,Up,groupjoin,up
bind=SUPER+ALT,Down,groupjoin,down
bind=SUPER,bracketleft,groupfocus,prev
bind=SUPER,bracketright,groupfocus,next
bind=SUPER+ALT,g,groupleave,

# ── Master area and layouts ──
bind=SUPER,h,setmfact,-0.05
bind=SUPER,l,setmfact,+0.05
bind=SUPER,Return,zoom,
bind=SUPER,n,switch_layout
bind=SUPER,t,setlayout,right_tile
bind=SUPER+SHIFT,t,setlayout,tile
bind=SUPER,m,setlayout,vertical_tile
bind=SUPER,u,setlayout,center_tile
bind=SUPER,w,setlayout,fair
bind=SUPER+SHIFT,w,setlayout,vertical_fair
# deck: windows stacked full-size, focused on top. waybar shows it as [K].
bind=SUPER,c,setlayout,deck

# Scroller layout, on ALT as a secondary layout.
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

# Dwindle layout: manual split mode.
bind=alt+shift,Return,dwindle_toggle_split_direction

# ── Window position and state ──
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,space,togglefloating,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,g,toggleglobal,
bind=SUPER,o,toggleoverlay,
# Quake-style dropdown terminal. The dedicated appid keeps it isolated from
# normal ghostty windows and is what the windowrule below matches on.
bind=SUPER,backslash,toggle_named_scratchpad,com.ghostty.scratchpad,none,~/.local/bin/ghostty-scratchpad
windowrule=isnamedscratchpad:1,appid:com.ghostty.scratchpad,width:1536,height:918

# movewin is UNBOUND on purpose: Ctrl+Shift+arrows is a near-universal
# text-editing shortcut, and binding it at the compositor stole it from every
# app. Move floating windows with Super+left-drag instead, or re-add it on a
# WM-only modifier such as SUPER+ALT+arrows.
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# ── Tags ──
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Show tag N alongside the current view.
bind=SUPER+CTRL,1,toggleview,1
bind=SUPER+CTRL,2,toggleview,2
bind=SUPER+CTRL,3,toggleview,3
bind=SUPER+CTRL,4,toggleview,4
bind=SUPER+CTRL,5,toggleview,5
bind=SUPER+CTRL,6,toggleview,6
bind=SUPER+CTRL,7,toggleview,7
bind=SUPER+CTRL,8,toggleview,8
bind=SUPER+CTRL,9,toggleview,9

# Move the focused window to tag N without following it.
bind=SUPER+SHIFT,1,tagsilent,1,0
bind=SUPER+SHIFT,2,tagsilent,2,0
bind=SUPER+SHIFT,3,tagsilent,3,0
bind=SUPER+SHIFT,4,tagsilent,4,0
bind=SUPER+SHIFT,5,tagsilent,5,0
bind=SUPER+SHIFT,6,tagsilent,6,0
bind=SUPER+SHIFT,7,tagsilent,7,0
bind=SUPER+SHIFT,8,tagsilent,8,0
bind=SUPER+SHIFT,9,tagsilent,9,0

# ── Gaps ──
bind=SUPER,minus,incgaps,-5
bind=SUPER,equal,incgaps,5
bind=SUPER+SHIFT,equal,togglegaps

# ── Monitors ──
bind=SUPER,comma,focusmon,left
bind=SUPER,period,focusmon,right
bind=SUPER+SHIFT,comma,tagmon,left
bind=SUPER+SHIFT,period,tagmon,right

# ── Mouse ──
# btn_left and btn_right can't bind the none mod key.
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
# btn_middle intentionally left unbound so apps keep middle-click.
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# ── Layer rules ──
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
