left_separator: " | "
script_dir: "~/.local/bin/statusbar"
update_all_signal: 0

segments:
    - script: "volume"
      icon: "🔊 "
      update_interval: 10
      hide_if_empty: true
      left_separator: ""
      signals: [1]
    - script: "cpu"
      update_interval: 5
      icon: "🧠 "
      hide_if_empty: true
      trim: false
    - script: "memory"
      update_interval: 10
      icon: "💾 "
      hide_if_empty: true
      trim: false
    - script: "bandwidth"
      update_interval: 3
      icon: "🌐 "
      hide_if_empty: true
    - program: "date"
      args: ["+⏰ %a, %b %d %H:%M"]
      update_interval: 1
