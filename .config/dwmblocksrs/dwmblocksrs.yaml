left_separator: " | "
#update_all_signal: 0

segments:
    - command: "cpubusy"
      left_separator: ""
      update_interval: 1
      icon: "🧠 "
      hide_if_empty: true
      trim: false
    - command: "memory"
      update_interval: 5
      icon: "💾 "
      hide_if_empty: true
      trim: false
    - command: "routebps"
      update_interval: 1
      icon: "🌐 "
      hide_if_empty: false
      trim: false
    - command: "protonmail-status"
      update_interval: 5
      hide_if_empty: false
    - command: "mullvad-status"
      update_interval: 30
      hide_if_empty: false
      trim: true
      signals: [2]
    - command: "date"
      args: ["+⏰ %m-%d %a %H:%M"]
      update_interval: 1
    - command: "volume"
      trim: false
      icon: "🔊 "
      update_interval: 10
      hide_if_empty: true
      right_separator: " "
      signals: [1]
