env:
  TERM: alacritty

window:
  padding:
    x: 2
    y: 0

draw_bold_text_with_bright_colors: true

cursor:
  unfocused_hollow: true

scrolling:
  history: 100000
  multiplier: 7
  # Scroll to the bottom when new text is written to the terminal.
  auto_scroll: true

selection:
  save_to_clipboard: true

font:
  size: 15.0
  normal:
    family: Victor Mono
    style: SemiBold

# Autostart zellij
shell:
  program: /usr/bin/zellij

  # program: /bin/zsh
  # args:
  #   - -l
  #   - -c
  #   - "tmux attach || tmux"
  #

colors:
  primary:
    background: "#000000"
    foreground: "#ffffff"
    dim_foreground: "#8b8b8b"
    bright_foreground: "#ffffff"
  normal:
    black:   "#000000"
    red:     "#ff5f59"
    green:   "#44bc44"
    yellow:  "#d0bc00"
    blue:    "#2fafff"
    magenta: "#feacd0"
    cyan:    "#00d3d0"
    white:   "#ffffff"
  bright:
    black:   "#8b8b8b"
    red:     "#ff5f5f"
    green:   "#44df44"
    yellow:  "#efef00"
    blue:    "#338fff"
    magenta: "#ff66ff"
    cyan:    "#9ac8e0"
    white:   "#ffffff"
  dim:
    black:   "#2A2A2A"
    red:     "#ff9580"
    green:   "#88ca9f"
    yellow:  "#d2b580"
    blue:    "#82b0ec"
    magenta: "#caa6df"
    cyan:    "#9ac8e0"
    white:   "#989898"
