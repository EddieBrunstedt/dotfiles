env:
  TERM: alacritty

window:
  padding:
    x: 2
    y: 0

draw_bold_text_with_bright_colors: true

cursor:
  unfocused_hollow: true

scrolling:
  history: 100000
  multiplier: 7
  # Scroll to the bottom when new text is written to the terminal.
  auto_scroll: true

selection:
  save_to_clipboard: true

font:
  size: 10.0
  normal:
    family: Iosevka Nerd Font Mono

# Autostart tmux
shell:
  program: /bin/zsh
  args:
    - -l
    - -c
    - "tmux attach || tmux"
