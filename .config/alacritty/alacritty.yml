env:
  TERM: alacritty

window:
  padding:
    x: 2
    y: 0

draw_bold_text_with_bright_colors: true

cursor:
  unfocused_hollow: true

scrolling:
  history: 100000
  multiplier: 7
  # Scroll to the bottom when new text is written to the terminal.
  auto_scroll: true

selection:
  save_to_clipboard: true

font:
  size: 10.0
  normal:
    family: Iosevka Nerd Font Mono

# Autostart tmux
shell:
  program: /bin/zsh
  args:
    - -l
    - -c
    - "tmux attach || tmux"

  # Whale theme
  # https://github.com/anufrievroman/whale
  colors:
    # Default colors
    primary:
      background: "0x1a1e2a"
      foreground: "0xffffff"
    # Normal colors
    normal:
      black: "0x1d2430"
      red: "0xfa5ead"
      green: "0x00fbad"
      yellow: "0xffdf5f"
      blue: "0x5eadfc"
      magenta: "0xfa5ead"
      cyan: "0x242D42"
      white: "0xffffff"
    # Bright colors
    bright:
      black: "0x1d2430"
      red: "0xfa5ead"
      green: "0x00fbad"
      yellow: "0xffdf5f"
      blue: "0x5eadfc"
      magenta: "0xfa5ead"
      cyan: "0x6a6f87"
      white: "0xeff1f5"
