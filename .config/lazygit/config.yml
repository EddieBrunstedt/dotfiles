gui:
    timeFormat: '1985-02-16' # https://pkg.go.dev/time#Time.Format
    shortTimeFormat: '15:04'
    theme:
        selectedLineBgColor:
            - "#292e42"
os:
    editPreset: 'nvim'
git:
    paging:
        colorArg: always
        pager: delta --paging=never --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
keybinding:
    universal:
        quit: <disabled>
