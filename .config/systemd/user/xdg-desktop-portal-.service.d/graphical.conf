# Tear the display-connected portal backends down with the graphical session.
#
# Prefix drop-in: systemd truncates a unit name at each "-" looking for
# drop-in dirs, so "xdg-desktop-portal-.service.d/" matches the BACKENDS
# (xdg-desktop-portal-gtk, xdg-desktop-portal-wlr) but not the frontend
# xdg-desktop-portal.service, which needs nothing here.
#
# THE PROBLEM this solves. Both backends hold a display connection -- wlr to
# the wayland socket, gtk to :0 -- and both default to systemd's app.slice.
# While app.slice was PartOf=graphical-session.target they were stopped as
# part of the slice, cleanly, before the compositor's socket went away:
#
#     Stopping Portal service (wlroots implementation)...
#     Stopped Portal service (wlroots implementation).
#
# Once that binding was reverted (see app-.scope.d/graphical.conf), they were
# left to be stopped by their own PartOf, which lost the race with the
# compositor exiting. They died reactively instead:
#
#     xdg-desktop-portal-wlr[14241]: wayland: failed to connect to display
#     xdg-desktop-portal-gtk[14217]: cannot open display: :0
#
# wlr is Restart=on-failure, so it burned all five StartLimitBurst attempts
# against a dead display in under two seconds and latched into failed state.
# A latched start limit does not clear on its own, so the NEXT login had no
# screencast portal until someone ran `systemctl --user reset-failed`.
#
# app-graphical.slice is itself PartOf=graphical-session.target, so putting
# them there restores the stop-as-a-slice ordering that used to work.
#
# The three session.slice portal units (xdg-desktop-portal, xdg-document-
# portal, xdg-permission-store) are pure D-Bus services with no display
# connection and shut down cleanly either way -- deliberately left alone.
[Service]
Slice=app-graphical.slice
