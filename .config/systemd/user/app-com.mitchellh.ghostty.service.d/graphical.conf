# Stop ghostty's daemon with the session (the packaged unit is only WantedBy).
[Unit]
PartOf=graphical-session.target
After=graphical-session.target

[Service]
Slice=app-graphical.slice
# Packaged Type=notify-reload races: ghostty 1.3.1 sends READY before it
# handles SIGUSR2, and systemd fails the start. Drop once ghostty fixes that.
Type=notify
ExecReload=/usr/bin/kill -USR2 $MAINPID
