# Stop ghostty's single-instance daemon with the graphical session.
#
# The packaged unit (/usr/lib/systemd/user/app-com.mitchellh.ghostty.service)
# is enabled with WantedBy=graphical-session.target only. Wants/WantedBy
# STARTS a unit with a target but never STOPS it with that target -- only
# PartOf/BindsTo propagate stop -- so without this the daemon outlived logout.
#
# Slice= is set too: the packaged unit inherits systemd's default app.slice,
# which is no longer session-bound (see app-.scope.d/graphical.conf for why
# binding app.slice itself was reverted).
[Unit]
PartOf=graphical-session.target
After=graphical-session.target

[Service]
Slice=app-graphical.slice
