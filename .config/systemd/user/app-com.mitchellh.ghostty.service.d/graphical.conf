# Stop ghostty's single-instance daemon with the graphical session.
#
# The packaged unit (/usr/lib/systemd/user/app-com.mitchellh.ghostty.service)
# is enabled with WantedBy=graphical-session.target only. Wants/WantedBy
# STARTS a unit with a target but never STOPS it with that target -- only
# PartOf/BindsTo propagate stop -- so without this the daemon outlived logout.
#
# Slice= is set too: the packaged unit would otherwise inherit systemd's default
# app.slice, which is not session-bound and must not be made so — see
# app-.scope.d/graphical.conf.
[Unit]
PartOf=graphical-session.target
After=graphical-session.target

[Service]
Slice=app-graphical.slice
# The packaged Type=notify-reload races: ghostty 1.3.1 reports READY a moment
# before it installs its SIGUSR2 handler, and systemd 262 refuses a
# notify-reload service whose main process has no handler for the reload
# signal at READY ("lacks handler for reload signal USR2", Result: protocol).
# It lost the race 2 times in 12 starts on an idle system and at login on
# 2026-10-19. Plain notify skips that check; ExecReload keeps `systemctl
# --user reload` working, as the handler is there once ghostty is up. Drop
# this once ghostty installs the handler before READY.
Type=notify
ExecReload=/usr/bin/kill -USR2 $MAINPID
