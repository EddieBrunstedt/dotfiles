# Prefix drop-in for every app-*.scope: binds Chromium/Electron apps that move
# themselves into their own scope to the graphical session.
#
# Never widen this to app.slice: it holds the D-Bus, PipeWire and keyring
# sockets, and stopping them at logout breaks the next login.
[Unit]
PartOf=graphical-session.target
After=graphical-session.target

[Scope]
Slice=app-graphical.slice
