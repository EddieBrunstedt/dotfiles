# Bind self-scoping apps to the graphical session.
#
# Prefix drop-in: systemd truncates a unit name at each "-" looking for
# drop-in dirs, so "app-.scope.d/" applies to EVERY unit named app-*.scope.
# This is the same mechanism uwsm uses for flatpaks -- see
# /run/user/1000/systemd/user/app-flatpak-.scope.d/, which this mirrors.
#
# THE PROBLEM this solves. Chromium/Electron/CEF apps call StartTransientUnit
# over D-Bus at startup to move themselves into their own scope, escaping the
# compositor's cgroup. They land in bare app.slice as
# app-org.chromium.Chromium-N.scope (seen from both vesktop and Spotify).
# Nothing about how they are launched prevents this, so it has to be caught
# on the receiving end -- by unit name, which is the one thing they follow a
# convention for.
#
# This replaces an earlier drop-in that put PartOf=graphical-session.target on
# app.slice itself. That was far too broad: app.slice is systemd's DEFAULT
# slice for user units, so it also holds dbus.socket, pipewire*.socket, the
# gpg-agent sockets, ssh-agent.socket and gnome-keyring-daemon.socket.
# Stopping a slice stops every unit in it, so logging out closed the user
# session bus. Nothing re-triggers sockets.target afterwards, so
# /run/user/1000/bus stayed dead and the NEXT login failed in uwsm's env
# preloader with "Failed to connect to socket /run/user/1000/bus: Connection
# refused" -- unrecoverable without a reboot.
#
# Scoping the rule to app-*.scope catches the escapees without touching any of
# that infrastructure.
[Unit]
PartOf=graphical-session.target
After=graphical-session.target

[Scope]
Slice=app-graphical.slice
