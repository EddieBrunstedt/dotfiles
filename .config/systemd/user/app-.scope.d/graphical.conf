# Bind self-scoping apps to the graphical session.
#
# Prefix drop-in: systemd truncates a unit name at each "-" looking for drop-in
# dirs, so "app-.scope.d/" applies to every unit named app-*.scope. Chromium/
# Electron/CEF apps call StartTransientUnit over D-Bus to move themselves into
# such a scope, escaping the compositor's cgroup; unit name is the only
# convention they reliably follow, so they have to be caught here.
#
# Do NOT widen this to app.slice. That is systemd's default slice for user
# units, so it also holds dbus.socket, pipewire*.socket and the gpg/ssh/keyring
# sockets. Stopping a slice stops everything in it, so logout would kill the
# user session bus, and nothing re-triggers sockets.target afterwards — the
# next login then fails in uwsm's env preloader, unrecoverable without a reboot.
[Unit]
PartOf=graphical-session.target
After=graphical-session.target

[Scope]
Slice=app-graphical.slice
