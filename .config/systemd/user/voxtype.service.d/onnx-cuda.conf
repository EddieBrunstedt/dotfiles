# Run the ONNX build with CUDA, which the Parakeet engine needs.
#
# The packaged unit starts /usr/bin/voxtype, a symlink that `voxtype setup gpu`
# points at the Whisper (Vulkan) build. That build has no Parakeet engine, so
# with engine = "parakeet" the daemon would fail to load the model.
[Service]
ExecStart=
ExecStart=/usr/lib/voxtype/voxtype-onnx-cuda-13 -q daemon
