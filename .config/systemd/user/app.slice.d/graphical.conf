# Bind app.slice to the graphical session, so logging out of Mango is a clean
# slate without per-app fixes.
#
# THE PROBLEM this solves. Three things live in the user manager at once:
#
#   session.slice/wayland-wm@mango.desktop.service  everything mango spawns
#   app-graphical.slice                             uwsm's session-bound slice
#   app.slice                                       everything else
#
# The first two already stop on logout — the compositor unit is KillMode=
# control-group so its whole cgroup dies with it, and app-graphical.slice is
# PartOf=graphical-session.target. Bare app.slice was the hole, and things
# reach it two ways that no per-app fix can cover generally:
#
#   1. Packaged units enabled with only `WantedBy=graphical-session.target`.
#      Wants/WantedBy starts a unit with a target but does NOT stop it with
#      that target — only PartOf/BindsTo propagate stop. soteria.service and
#      app-com.mitchellh.ghostty.service are both this shape.
#   2. Apps that move THEMSELVES into a transient scope in app.slice at
#      startup, escaping the compositor's cgroup. Electron/Chromium does this
#      unconditionally: vesktop showed up as app-org.chromium.Chromium-N.scope
#      while leaving its zygotes behind in the compositor cgroup, so logout
#      killed the zygotes and orphaned the parent. Nothing about how it was
#      launched could have prevented that.
#
# Binding the slice catches both, and catches whatever the next such app is.
# Stopping a slice stops every unit inside it, so this is one rule instead of
# a growing list of drop-ins.
#
# WHY THIS IS SAFE for what's currently in app.slice: dconf, at-spi, and the
# three xdg-desktop-portal units are all Type=dbus, and gnome-keyring-daemon
# is socket-activated (TriggeredBy=gnome-keyring-daemon.socket, which lives in
# sockets.target, not here). All of them re-activate on demand at next login.
# wayland-session-shutdown.target is StopWhenUnneeded=yes, so it goes inactive
# right after teardown and the Conflicts= below cannot wedge app.slice off.
#
# THE ONE EXCEPTION is a unit that must outlive the compositor — with
# Linger=yes those exist. forgejo-runner.service starts at boot, well before
# mango, and now sets Slice=background.slice to stay out of here. Put any
# future boot-time daemon there too; that is the intended home for work not
# tied to a session.
#
# Directives mirror uwsm's own app-graphical.slice (see `systemctl --user cat
# app-graphical.slice`), which is the pattern this generalizes.

[Unit]
PartOf=graphical-session.target
Conflicts=wayland-session-shutdown.target
Before=wayland-session-shutdown.target
