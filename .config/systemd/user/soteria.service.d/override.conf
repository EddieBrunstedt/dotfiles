# Soteria requires XDG_SESSION_ID to register its polkit agent, but user
# services run outside the login session so the var is not set there. The
# ExecStart below resolves the active seat0 session instead.
#
# PartOf is what stops the agent at logout: this unit is enabled into
# graphical-session.target, and WantedBy only propagates start, not stop.
[Unit]
PartOf=graphical-session.target
After=graphical-session.target

[Service]
Slice=app-graphical.slice
ExecStart=
ExecStart=/bin/sh -c 'export XDG_SESSION_ID="$(loginctl show-seat seat0 --value -p ActiveSession)"; exec /usr/lib/soteria-polkit/soteria'
