# Soteria requires XDG_SESSION_ID to register its polkit agent, but user
# services run outside the login session so the var is not set there. Resolve
# the active seat0 session at start instead. (Also enabled into
# graphical-session.target rather than the packaged default.target, so it only
# runs in graphical logins.)
[Service]
ExecStart=
ExecStart=/bin/sh -c 'export XDG_SESSION_ID="$(loginctl show-seat seat0 --value -p ActiveSession)"; exec /usr/lib/soteria-polkit/soteria'
